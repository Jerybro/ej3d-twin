<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資料盤點｜Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F7FA; --panel: #ffffff; --panel2: #F1F3F6;
      --bdr: #DBDDE0; --accent: #046AFB; --accent-deep: #E3EDFE;
      --text: #061027; --dim: #5C6773;
      --hi: #12A150; --mid: #E0A415; --lo: #D93F3F;
      /* 密度 8/10：儀表板級間距 8–32px */
      --s1: 8px; --s2: 12px; --s3: 16px; --s4: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 14px; }
    body { padding: var(--s4) var(--s4) 64px; max-width: 1560px; margin: 0 auto; }

    .top { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2);
      flex-wrap: wrap; }
    .home { display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px; background: rgba(4,106,251,.08);
      border: 1px solid var(--bdr); color: var(--accent); text-decoration: none; flex-shrink: 0; }
    .home:hover { border-color: var(--accent); }
    h1 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
    .sub { color: var(--dim); font-size: 12.5px; margin-top: 1px; }
    .sp { flex: 1; }
    .btn { padding: 7px 13px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--bdr); color: var(--text);
      font-family: inherit; text-decoration: none; display: inline-block;
      transition: border-color .15s, color .15s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn[disabled] { opacity: .45; pointer-events: none; }

    /* KPI 磚列 */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(184px, 1fr));
      gap: var(--s2); margin-bottom: var(--s4); }
    .kpi { background: var(--panel); border: 1px solid var(--bdr); border-radius: 12px;
      padding: var(--s2) var(--s3); }
    .kpi .k { font-size: 11.5px; color: var(--dim); letter-spacing: .02em; }
    .kpi .v { font-size: 25px; font-weight: 700; line-height: 1.25;
      font-variant-numeric: tabular-nums; margin-top: 2px; }
    .kpi .v small { font-size: 13px; font-weight: 500; color: var(--dim); margin-left: 3px; }
    .kpi .n { font-size: 11.5px; color: var(--dim); margin-top: 2px; min-height: 16px; }

    .card { background: var(--panel); border: 1px solid var(--bdr); border-radius: 12px;
      padding: var(--s3); margin-bottom: var(--s4); }
    .card h2 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .card .cap { font-size: 12px; color: var(--dim); margin-bottom: var(--s3); line-height: 1.65; }

    /* 甘特時間軸 */
    .gantt { overflow-x: auto; }
    .gantt svg { display: block; min-width: 680px; }
    .grow { cursor: default; }
    .grow:hover .gbar { filter: brightness(.92); }
    .glabel { font-size: 11.5px; fill: #061027; }
    .gmeta { font-size: 10.5px; fill: #5C6773; font-variant-numeric: tabular-nums; }
    .gaxis { font-size: 10.5px; fill: #5C6773; }
    .gline { stroke: #DBDDE0; stroke-width: 1; }

    /* 資料集表：窄螢幕在自己的容器內橫向捲動，不推擠版面 */
    #table { overflow-x: auto; }
    table { width: 100%; min-width: 880px; border-collapse: collapse; font-size: 12.5px; }
    th { text-align: left; font-size: 11px; color: var(--dim); font-weight: 600;
      letter-spacing: .03em; padding: 0 var(--s2) var(--s1); border-bottom: 1px solid var(--bdr);
      white-space: nowrap; }
    td { padding: var(--s2); border-bottom: 1px solid var(--panel2); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--panel2); }
    .fn { font-weight: 600; word-break: break-all; }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 7px;
      border-radius: 9px; border: 1px solid; white-space: nowrap; }
    .tag.ok { color: #0B6B36; border-color: rgba(18,161,80,.45); background: rgba(18,161,80,.09); }
    .tag.warn { color: #6b4a05; border-color: rgba(224,164,21,.5); background: rgba(224,164,21,.11); }
    .tag.bad { color: #99201f; border-color: rgba(217,63,63,.45); background: rgba(217,63,63,.09); }
    .tag.dim { color: var(--dim); border-color: var(--bdr); background: var(--panel2); }
    .bar { height: 6px; border-radius: 3px; background: var(--panel2);
      border: 1px solid var(--bdr); overflow: hidden; min-width: 62px; margin-top: 3px; }
    .bar i { display: block; height: 100%; background: var(--hi); }
    .bar i.warn { background: var(--mid); }
    .bar i.bad { background: var(--lo); }
    .yr { display: inline-block; font-size: 10.5px; color: var(--dim);
      background: var(--panel2); border: 1px solid var(--bdr);
      border-radius: 6px; padding: 0 5px; margin: 1px 3px 0 0; white-space: nowrap; }
    .empty { color: var(--dim); font-size: 12.5px; padding: var(--s4); text-align: center; }
    .spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--accent-deep); border-top-color: var(--accent);
      animation: sp .7s linear infinite; vertical-align: -1px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="top">
    <a class="home" href="/" title="回首頁" aria-label="回首頁">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </a>
    <div>
      <h1>資料盤點</h1>
      <div class="sub">收到的資料在時間上長什麼樣子——年份、涵蓋期間、幾分鐘一筆、中間斷過幾次</div>
    </div>
    <span class="sp"></span>
    <a class="btn" href="/data">← 資料工作台</a>
    <button class="btn" id="refresh" type="button">重新掃描</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <section class="card">
    <h2>時間覆蓋</h2>
    <div class="cap">每條＝一份資料集在時間軸上的涵蓋範圍。<b>橫向沒有重疊的兩份資料不能直接 join</b>——
      不同年份的資料被當成同一段期間訓練，是這類專案最常見也最難察覺的錯誤。</div>
    <div class="gantt" id="gantt"><div class="empty"><span class="spin"></span> 掃描中…</div></div>
  </section>

  <section class="card">
    <h2>逐份明細</h2>
    <div class="cap">取樣間隔取<b>相鄰時間戳差值的中位數</b>；覆蓋率＝實際筆數 ÷ 該間隔下的應有筆數；
      斷點＝間隔超過中位數 10 倍且至少 5 分鐘。首次掃描會實際讀過每份資料，大檔要幾十秒，之後走快取。</div>
    <div id="table"><div class="empty"><span class="spin"></span> 掃描中…</div></div>
  </section>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => (n == null ? '—' : Number(n).toLocaleString('zh-TW'));
const d10 = s => (s || '').slice(0, 10);
const covClass = p => (p >= 95 ? '' : (p >= 80 ? 'warn' : 'bad'));

function renderKpis(s) {
  const span = (s.earliest && s.latest)
    ? Math.round((new Date(s.latest) - new Date(s.earliest)) / 86400000) : null;
  const tiles = [
    ['資料集', s.n_datasets, s.n_dated + ' 份判得出時間軸'],
    ['總列數', nf(s.n_rows_total), ''],
    ['最早資料', d10(s.earliest) || '—', ''],
    ['最晚資料', d10(s.latest) || '—', ''],
    ['總跨度', span == null ? '—' : nf(span), span == null ? '' : '天'],
    ['取樣間隔種類', (s.intervals || []).length, (s.intervals || []).join('、') || '—'],
  ];
  $('kpis').innerHTML = tiles.map(t =>
    '<div class="kpi"><div class="k">' + esc(t[0]) + '</div><div class="v">' + esc(t[1]) +
    '</div><div class="n">' + esc(t[2]) + '</div></div>').join('');
}

function renderGantt(rows) {
  const ok = rows.filter(r => r.ok);
  if (!ok.length) { $('gantt').innerHTML = '<div class="empty">沒有可判定時間軸的資料集。</div>'; return; }
  const t0 = Math.min.apply(null, ok.map(r => +new Date(r.start)));
  const t1 = Math.max.apply(null, ok.map(r => +new Date(r.end)));
  const padL = 236, padR = 28, W = 940;
  const rowH = 30, top = 34, H = top + ok.length * rowH + 14;
  const x = t => padL + (t - t0) / Math.max(t1 - t0, 1) * (W - padL - padR);

  // 跨年時一年一刻度，同年時一季一刻度
  const ticks = [];
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear();
  if (y1 > y0) { for (let y = y0; y <= y1 + 1; y++) ticks.push([+new Date(y, 0, 1), String(y)]); }
  else { for (let m = 0; m < 12; m += 3) ticks.push([+new Date(y0, m, 1), y0 + '/' + (m + 1)]); }

  const p = ['<svg width="' + W + '" height="' + H + '" role="img" aria-label="資料集時間覆蓋甘特圖">'];
  ticks.forEach(function (tk) {
    const xx = x(tk[0]);
    if (xx < padL - 40 || xx > W) return;
    p.push('<line class="gline" x1="' + xx.toFixed(1) + '" y1="26" x2="' + xx.toFixed(1) + '" y2="' + (H - 10) + '"/>');
    p.push('<text class="gaxis" x="' + xx.toFixed(1) + '" y="18" text-anchor="middle">' + esc(tk[1]) + '</text>');
  });
  ok.forEach(function (r, i) {
    const y = top + i * rowH, a = x(+new Date(r.start)), b = x(+new Date(r.end));
    const w = Math.max(b - a, 3);
    const col = r.coverage_pct >= 95 ? '#12A150' : (r.coverage_pct >= 80 ? '#E0A415' : '#D93F3F');
    const name = String(r.filename || r.sid);
    p.push('<g class="grow"><title>' + esc(name) + '｜' + esc(d10(r.start)) + ' → ' + esc(d10(r.end)) +
           '｜每 ' + esc(r.interval_text) + '｜覆蓋 ' + r.coverage_pct + '%</title>');
    p.push('<text class="glabel" x="0" y="' + (y + 13) + '">' +
           esc(name.length > 27 ? name.slice(0, 26) + '…' : name) + '</text>');
    p.push('<text class="gmeta" x="0" y="' + (y + 25) + '">每 ' + esc(r.interval_text) + '　' + nf(r.n_rows) + ' 列</text>');
    p.push('<rect class="gbar" x="' + a.toFixed(1) + '" y="' + (y + 4) + '" width="' + w.toFixed(1) +
           '" height="15" rx="4" fill="' + col + '" opacity="0.82"/>');
    p.push('</g>');
  });
  p.push('</svg>');
  $('gantt').innerHTML = p.join('');
}

function renderTable(rows) {
  if (!rows.length) { $('table').innerHTML = '<div class="empty">資料工作台還沒有資料集。</div>'; return; }
  const body = rows.map(function (r) {
    if (!r.ok) {
      return '<tr><td class="fn">' + esc(r.filename || r.sid) + '</td>' +
        '<td colspan="6"><span class="tag dim">無時間軸</span> <span style="color:var(--dim)">' +
        esc(r.time_source || '') + '</span></td>' +
        '<td class="num">' + nf(r.n_rows) + '</td></tr>';
    }
    const yrs = Object.keys(r.years || {}).sort().map(function (y) {
      return '<span class="yr">' + esc(y) + '·' + nf(r.years[y]) + '</span>';
    }).join('');
    return '<tr>' +
      '<td><div class="fn">' + esc(r.filename || r.sid) + '</div>' +
      '<div style="color:var(--dim);font-size:11px;margin-top:2px">時間欄：' + esc(r.time_source) + '</div></td>' +
      '<td class="num">' + esc(d10(r.start)) + '<br><span style="color:var(--dim)">→ ' + esc(d10(r.end)) + '</span></td>' +
      '<td class="num">' + r.span_days + ' 天</td>' +
      '<td class="num"><b>' + esc(r.interval_text) + '</b>' +
        (r.regular ? '' : '<br><span class="tag warn" style="margin-top:2px">不規則</span>') + '</td>' +
      '<td class="num">' + r.coverage_pct + '%<div class="bar"><i class="' + covClass(r.coverage_pct) +
        '" style="width:' + Math.min(r.coverage_pct, 100) + '%"></i></div></td>' +
      '<td class="num">' + (r.n_gaps
        ? '<span class="tag ' + (r.n_gaps > 20 ? 'bad' : 'warn') + '">' + r.n_gaps + ' 處</span>' +
          '<br><span style="color:var(--dim)">最長 ' + r.max_gap_hours + ' 小時</span>'
        : '<span class="tag ok">連續</span>') + '</td>' +
      '<td>' + (yrs || '—') + '</td>' +
      '<td class="num">' + nf(r.n_rows) + '<br><span style="color:var(--dim)">' + nf(r.n_cols) + ' 欄</span></td>' +
      '</tr>';
  }).join('');
  $('table').innerHTML = '<table><thead><tr>' +
    '<th>資料集</th><th>期間</th><th>跨度</th><th>取樣間隔</th>' +
    '<th>覆蓋率</th><th>斷點</th><th>年份分布</th><th>規模</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table>';
}

async function load(refresh) {
  const b = $('refresh');
  b.disabled = true;
  if (refresh) {
    $('gantt').innerHTML = '<div class="empty"><span class="spin"></span> 重新掃描中，大檔要幾十秒…</div>';
  }
  try {
    const r = await fetch('/api/data/inventory' + (refresh ? '?refresh=1' : ''));
    if (!r.ok) throw new Error('伺服器錯誤 ' + r.status);
    const d = await r.json();
    renderKpis(d.summary); renderGantt(d.datasets); renderTable(d.datasets);
  } catch (e) {
    $('gantt').innerHTML = '<div class="empty">載入失敗：' + esc(e.message) + '</div>';
    $('table').innerHTML = '';
  } finally { b.disabled = false; }
}
$('refresh').addEventListener('click', function () { load(true); });
load(false);
</script>
</body>
</html>

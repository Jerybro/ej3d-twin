<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資料前處理｜EJ Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e141b; --panel: #131b24; --panel2: #17212c;
      --bdr: #223140; --accent: #46c2e0; --accent-deep: #1f6ea8;
      --text: #dbe5ee; --dim: #8ba0b3; --warn: #ffaa3c; --danger: #ff4d4f; --ok: #35e08c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 14px; overflow: hidden; }
    .layout { display: flex; height: 100vh; }
    aside.left {
      width: 260px; flex-shrink: 0; border-right: 1px solid var(--bdr);
      padding: 16px; overflow-y: auto; background: var(--panel);
    }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .brand-home {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px;
      background: rgba(70, 194, 224, 0.15); border: 1px solid var(--bdr);
      color: var(--accent); font-size: 11px; font-weight: 700; text-decoration: none;
    }
    h1 { font-size: 15px; font-weight: 700; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--accent);
      letter-spacing: 1px; margin: 16px 0 8px; }
    .drop {
      border: 1.5px dashed var(--bdr); border-radius: 10px; padding: 16px;
      text-align: center; color: var(--dim); font-size: 12.5px; cursor: pointer;
    }
    .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
    .drop input { display: none; }
    #file-meta { font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.6; }
    .col-item {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      border-radius: 6px; cursor: pointer; font-size: 12.5px;
    }
    .col-item:hover { background: rgba(70, 194, 224, 0.08); }
    .col-item input { accent-color: var(--accent); }
    .col-item .dtype { margin-left: auto; color: var(--dim); font-size: 10.5px; }
    main.center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #toolbar {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      border-bottom: 1px solid var(--bdr); background: var(--panel);
    }
    .tbtn {
      padding: 6px 13px; border-radius: 7px; cursor: pointer; font-family: inherit;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); font-size: 12.5px;
    }
    .tbtn:hover { border-color: var(--accent); }
    .tbtn.warn { border-color: rgba(255, 170, 60, 0.5); color: var(--warn); }
    .tbtn.warn:hover { background: rgba(255, 170, 60, 0.1); }
    .tbtn:disabled { opacity: 0.4; pointer-events: none; }
    #stat-chip { margin-left: auto; font-size: 12px; color: var(--dim); }
    #stat-chip b { color: var(--ok); }
    #chart-wrap { flex: 1; position: relative; min-height: 0; }
    #chart { width: 100%; height: 100%; display: block; cursor: crosshair; }
    #chart-hint { position: absolute; top: 10px; left: 14px; font-size: 12px; color: var(--dim);
      background: rgba(14,20,27,0.8); padding: 4px 10px; border-radius: 8px; }
    aside.right {
      width: 320px; flex-shrink: 0; border-left: 1px solid var(--bdr);
      background: var(--panel); display: flex; flex-direction: column;
    }
    .tabs { display: flex; border-bottom: 1px solid var(--bdr); }
    .tab {
      flex: 1; padding: 11px 0; text-align: center; cursor: pointer;
      font-size: 13px; color: var(--dim); border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .tab-body { flex: 1; overflow-y: auto; padding: 14px; display: none; }
    .tab-body.show { display: block; }
    .rule-row {
      background: var(--panel2); border: 1px solid var(--bdr); border-radius: 8px;
      padding: 10px; margin-bottom: 8px; font-size: 12.5px;
    }
    .rule-row select, .rule-row input {
      width: 100%; margin-top: 5px; padding: 5px 8px; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--bdr); color: var(--text);
      font-family: inherit; font-size: 12.5px;
    }
    .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .rule-del { float: right; color: var(--danger); cursor: pointer; font-size: 12px; }
    .reason-stat { font-size: 12.5px; padding: 6px 10px; border-radius: 6px;
      background: var(--panel2); margin-bottom: 5px; display: flex; justify-content: space-between; }
    .reason-stat b { color: var(--warn); }
    #corr-grid { display: grid; gap: 1px; font-size: 10px; }
    .corr-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 2px; cursor: default; color: rgba(255,255,255,0.85); }
    .corr-label { font-size: 10px; color: var(--dim); overflow: hidden; white-space: nowrap;
      display: flex; align-items: center; padding: 0 2px; }
    .hint { font-size: 11.5px; color: var(--dim); line-height: 1.7; margin-top: 8px; }
    select.mini, input.mini {
      padding: 6px 8px; border-radius: 6px; background: var(--bg);
      border: 1px solid var(--bdr); color: var(--text); font-family: inherit;
      font-size: 12.5px; width: 100%; margin-bottom: 7px;
    }
    .props-result { font-size: 12.5px; background: var(--panel2); border: 1px solid var(--bdr);
      border-radius: 8px; padding: 10px; margin-top: 10px; line-height: 1.8; }
    .props-result .bad { color: var(--danger); font-weight: 700; }
    .props-result .good { color: var(--ok); font-weight: 700; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="left">
      <div class="head">
        <a class="brand-home" href="/" title="回平台首頁">EJ</a>
        <h1>資料前處理</h1>
      </div>
      <label class="drop" id="drop">
        點擊或拖放 CSV / Excel
        <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.xlsm" />
      </label>
      <div id="file-meta"></div>
      <div class="section-title">欄位（勾選繪圖）</div>
      <div id="col-list"><span style="color:var(--dim);font-size:12px">先上傳資料</span></div>
    </aside>

    <main class="center">
      <div id="toolbar">
        <button class="tbtn warn" id="btn-exclude" disabled>剔除圈選</button>
        <button class="tbtn" id="btn-restore" disabled>復原圈選</button>
        <button class="tbtn" id="btn-clear-sel" disabled>取消選取</button>
        <button class="tbtn" id="btn-export" disabled>匯出清洗後 CSV</button>
        <span id="stat-chip">—</span>
      </div>
      <div id="chart-wrap">
        <canvas id="chart"></canvas>
        <span id="chart-hint">上傳資料並勾選欄位；拖曳框選資料點後可剔除</span>
      </div>
    </main>

    <aside class="right">
      <div class="tabs">
        <div class="tab active" data-tab="rules">清洗規則</div>
        <div class="tab" data-tab="corr">相關分析</div>
        <div class="tab" data-tab="props">物性模組</div>
      </div>

      <div class="tab-body show" id="tab-rules">
        <button class="tbtn" id="btn-add-rule" style="width:100%">新增規則</button>
        <div id="rule-list" style="margin-top:10px"></div>
        <button class="tbtn" id="btn-apply-rules" style="width:100%;margin-top:6px" disabled>套用規則</button>
        <div class="section-title">剔除統計</div>
        <div id="reason-stats"><span class="hint">尚未套用</span></div>
        <p class="hint">規則引擎與 TA32 五級穩態過濾同源：值域（停機/冷態）、
          跳變（非穩態）、分位離群、凍結值（儀錶卡死）。每筆剔除都有原因可審計。</p>
      </div>

      <div class="tab-body" id="tab-corr">
        <button class="tbtn" id="btn-corr" style="width:100%" disabled>計算皮爾森相關（勾選欄位）</button>
        <div id="corr-out" style="margin-top:12px"></div>
      </div>

      <div class="tab-body" id="tab-props">
        <p class="hint" style="margin:0 0 10px">
          CoolProp 物性引擎：物理合理性檢查標記超出物性邊界的數據
          （AI 外插的物理柵欄），並可推算衍生物性欄位供建模。</p>
        <select class="mini" id="props-fluid"></select>
        <select class="mini" id="props-tcol"><option value="">溫度欄位…</option></select>
        <select class="mini" id="props-tunit"><option value="C">°C</option><option value="K">K</option></select>
        <select class="mini" id="props-pcol"><option value="">壓力欄位（選填）…</option></select>
        <select class="mini" id="props-punit">
          <option value="kgcm2">kg/cm²g</option><option value="bar">bar</option>
          <option value="kPa">kPa</option><option value="Pa">Pa</option>
        </select>
        <button class="tbtn" id="btn-props-check" style="width:100%;margin-bottom:6px" disabled>物理合理性檢查</button>
        <button class="tbtn" id="btn-props-derive" style="width:100%" disabled>推算物性欄位</button>
        <div id="props-out"></div>
        <p class="hint">物理約束建模案例：<a href="/static/../docs/reactor_model.md" style="color:var(--accent)" target="_blank">Tatoray 約束平衡模型</a>（守恆＋平衡商，實測 MAE 0.5%）</p>
      </div>
    </aside>
  </div>
  <script type="module" src="/static/js/data.js"></script>
</body>
</html>

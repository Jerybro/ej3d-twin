<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 設計工作區｜J.S Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #0e141b; --panel: #131b24; --panel2: #17212c; --panel3: #1b2733;
      --bdr: #223140; --accent: #46c2e0; --accent-deep: #1f6ea8;
      --text: #dbe5ee; --dim: #8ba0b3; --warn: #ffaa3c; --danger: #ff4d4f;
      --ribbon-h: 92px; --status-h: 26px; --tree-w: 236px; --prop-w: 250px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 13px; }

    /* ================= 停靠佈局（對標 E3D：ribbon/樹/屬性/狀態列） ===== */
    #workspace {
      display: grid; height: 100vh;
      grid-template-rows: var(--ribbon-h) 1fr var(--status-h);
      grid-template-columns: var(--tree-w) 1fr var(--prop-w);
      grid-template-areas: "ribbon ribbon ribbon" "tree view prop" "status status status";
    }
    body.tree-collapsed #workspace { grid-template-columns: 0 1fr var(--prop-w); }
    body.prop-collapsed #workspace { grid-template-columns: var(--tree-w) 1fr 0; }
    body.tree-collapsed.prop-collapsed #workspace { grid-template-columns: 0 1fr 0; }

    /* ================= Ribbon 功能區 ================= */
    #ribbon { grid-area: ribbon; background: var(--panel); border-bottom: 1px solid var(--bdr);
      display: flex; flex-direction: column; user-select: none; }
    #ribbon-tabs { display: flex; align-items: center; height: 30px; padding: 0 8px; gap: 2px;
      border-bottom: 1px solid var(--bdr); }
    .brand-home {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 5px; margin-right: 8px;
      background: rgba(70, 194, 224, 0.15); border: 1px solid var(--bdr);
      color: var(--accent); font-size: 10px; font-weight: 700; text-decoration: none;
    }
    .rtab { padding: 5px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 12.5px;
      color: var(--dim); border: 1px solid transparent; border-bottom: none; background: none; font-family: inherit; }
    .rtab:hover { color: var(--text); }
    .rtab.active { color: var(--accent); background: var(--panel2); border-color: var(--bdr); font-weight: 600; }
    #scene-name { margin-left: auto; color: var(--dim); font-size: 12px; padding-right: 6px; }

    #ribbon-body { flex: 1; display: flex; align-items: stretch; padding: 4px 8px 5px; gap: 6px; overflow-x: auto; }
    .rgroup { display: flex; flex-direction: column; border-right: 1px solid var(--bdr); padding-right: 6px; }
    .rgroup:last-child { border-right: none; }
    .rgroup-tools { display: flex; gap: 4px; flex: 1; align-items: center; flex-wrap: wrap; max-height: 44px; }
    .rgroup-label { text-align: center; font-size: 10px; color: var(--dim); padding-top: 2px; letter-spacing: 1px; }
    .rbtn {
      min-width: 46px; padding: 4px 8px; border-radius: 6px; cursor: pointer; text-align: center;
      background: none; border: 1px solid transparent; color: var(--text); font-size: 11.5px; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.25;
    }
    .rbtn .ric { font-size: 15px; line-height: 1; color: var(--accent); font-weight: 700; }
    .rbtn:hover { background: var(--panel3); border-color: var(--bdr); }
    .rbtn.active { background: var(--accent-deep); border-color: var(--accent); }
    .rbtn.warn.active { background: rgba(255, 170, 60, 0.22); border-color: var(--warn); }
    .rbtn:disabled { opacity: 0.35; pointer-events: none; }
    .rsel { background: var(--panel2); border: 1px solid var(--bdr); color: var(--text);
      border-radius: 6px; padding: 4px 6px; font-family: inherit; font-size: 12px; max-width: 128px; }
    .rpage { display: none; flex: 1; }
    .rpage.active { display: flex; }

    /* ================= Model Explorer 模型樹 ================= */
    #tree-pane { grid-area: tree; background: var(--panel); border-right: 1px solid var(--bdr);
      display: flex; flex-direction: column; overflow: hidden; }
    .pane-head { display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-bottom: 1px solid var(--bdr); font-size: 12px; font-weight: 700;
      color: var(--accent); letter-spacing: 1px; flex-shrink: 0; }
    .pane-x { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0 3px; }
    .pane-x:hover { color: var(--accent); }
    #tree-search { margin: 6px 8px; padding: 5px 8px; background: var(--bg); color: var(--text);
      border: 1px solid var(--bdr); border-radius: 6px; font-family: inherit; font-size: 12px; flex-shrink: 0; }
    #tree-search:focus { outline: none; border-color: var(--accent); }
    #model-tree { flex: 1; overflow-y: auto; padding: 2px 4px 10px; }
    .mt-unit > summary { list-style: none; cursor: pointer; padding: 4px 6px; border-radius: 5px;
      font-size: 11.5px; color: var(--dim); display: flex; align-items: center; gap: 5px; }
    .mt-unit > summary::-webkit-details-marker { display: none; }
    .mt-unit > summary:hover { background: var(--panel3); }
    .mt-unit > summary .tw { transition: transform .12s; font-size: 9px; }
    .mt-unit[open] > summary .tw { transform: rotate(90deg); }
    .mt-eq { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 20px;
      border-radius: 5px; cursor: pointer; font-size: 12px; }
    .mt-eq:hover { background: var(--panel3); }
    .mt-eq.selected { background: var(--accent-deep); }
    .mt-eq.hidden-eq { opacity: 0.4; }
    .mt-ico { width: 14px; text-align: center; color: var(--accent); font-size: 10px; flex-shrink: 0; }
    .mt-tag { font-weight: 600; white-space: nowrap; }
    .mt-name { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ================= Properties 屬性格 ================= */
    #prop-pane { grid-area: prop; background: var(--panel); border-left: 1px solid var(--bdr);
      display: flex; flex-direction: column; overflow: hidden; }
    #prop-body { flex: 1; overflow-y: auto; padding: 8px; }
    .pg-section { font-size: 10.5px; color: var(--dim); letter-spacing: 1px; margin: 10px 2px 4px; }
    .pg-grid { display: grid; grid-template-columns: 88px 1fr; border: 1px solid var(--bdr); border-radius: 7px; overflow: hidden; }
    .pg-grid > label { padding: 6px 8px; background: var(--panel2); font-size: 11.5px; color: var(--dim);
      border-bottom: 1px solid var(--bdr); display: flex; align-items: center; }
    .pg-grid > .pg-v { padding: 3px; border-bottom: 1px solid var(--bdr); }
    .pg-grid > label:last-of-type, .pg-grid > .pg-v:last-of-type { border-bottom: none; }
    .pg-v input, .pg-v span { width: 100%; padding: 4px 6px; background: var(--bg); color: var(--text);
      border: 1px solid transparent; border-radius: 5px; font-family: inherit; font-size: 12.5px; display: block; }
    .pg-v span { background: none; color: var(--dim); }
    .pg-v input:hover { border-color: var(--bdr); }
    .pg-v input:focus { outline: none; border-color: var(--accent); background: var(--panel2); }
    .pbtn { width: 100%; margin-top: 8px; padding: 7px; border-radius: 7px; cursor: pointer;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); font-family: inherit; font-size: 12.5px; }
    .pbtn:hover { border-color: var(--accent); }
    .pbtn.danger { color: var(--danger); border-color: rgba(255, 77, 79, 0.4); }
    .pbtn.danger:hover { background: rgba(255, 77, 79, 0.12); }
    #prop-empty { color: var(--dim); font-size: 12px; text-align: center; margin-top: 30px; line-height: 1.8; }

    /* ================= 3D 視圖 ================= */
    #viewport { grid-area: view; position: relative; overflow: hidden; }
    #viewport canvas { display: block; }
    #axis-triad { position: absolute; right: 10px; bottom: 8px; width: 84px; height: 84px;
      z-index: 5; pointer-events: none; }
    #mode-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 25; padding: 6px 16px; border-radius: 16px; font-size: 12.5px;
      background: rgba(19, 27, 36, 0.94); border: 1px solid var(--bdr); color: var(--dim);
      max-width: 70%; text-align: center;
    }
    #mode-hint b { color: var(--accent); font-weight: 600; }
    #measure-tip { position: absolute; z-index: 26; padding: 3px 9px; border-radius: 10px;
      background: rgba(255, 170, 60, 0.92); color: #1a1204; font-size: 12px; font-weight: 700;
      pointer-events: none; display: none; }
    .pane-reopen { position: absolute; top: 8px; z-index: 24; padding: 5px 9px; border-radius: 7px;
      cursor: pointer; background: rgba(19, 27, 36, 0.92); border: 1px solid var(--bdr);
      color: var(--dim); font-family: inherit; font-size: 11.5px; display: none; }
    .pane-reopen:hover { color: var(--accent); border-color: var(--accent); }
    #tree-reopen { left: 8px; }
    #prop-reopen { right: 8px; }
    body.tree-collapsed #tree-reopen { display: block; }
    body.prop-collapsed #prop-reopen { display: block; }

    /* 右鍵情境選單 */
    #ctx-menu { position: fixed; z-index: 80; display: none; min-width: 150px;
      background: var(--panel); border: 1px solid var(--bdr); border-radius: 8px; padding: 4px;
      box-shadow: 0 8px 28px rgba(0,0,0,.5); }
    #ctx-menu button { display: block; width: 100%; text-align: left; padding: 7px 12px;
      background: none; border: none; color: var(--text); font-family: inherit; font-size: 12.5px;
      border-radius: 5px; cursor: pointer; }
    #ctx-menu button:hover { background: var(--accent-deep); }
    #ctx-menu button.danger { color: var(--danger); }
    #ctx-menu .ctx-sep { border-top: 1px solid var(--bdr); margin: 4px 6px; }

    /* ================= 狀態列 ================= */
    #statusbar { grid-area: status; display: flex; align-items: center; gap: 18px; padding: 0 12px;
      background: var(--panel); border-top: 1px solid var(--bdr); font-size: 11.5px; color: var(--dim);
      user-select: none; white-space: nowrap; overflow: hidden; }
    #statusbar b { color: var(--text); font-weight: 600; }
    .st-toggle { cursor: pointer; padding: 1px 8px; border-radius: 5px; border: 1px solid var(--bdr);
      background: none; color: var(--dim); font-family: inherit; font-size: 11px; }
    .st-toggle.on { color: var(--accent); border-color: var(--accent); }
    #st-coords { min-width: 210px; }

    /* ================= 開啟場景 modal ================= */
    #open-modal { position: fixed; inset: 0; z-index: 90; display: none;
      background: rgba(5, 9, 13, 0.7); align-items: center; justify-content: center; }
    #open-modal.show { display: flex; }
    .modal-box { width: 440px; max-height: 70vh; overflow-y: auto; background: var(--panel);
      border: 1px solid var(--bdr); border-radius: 12px; padding: 20px; }
    .panel-title { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-bottom: 10px; }
    .scene-item { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
      background: var(--panel2); border: 1px solid var(--bdr); }
    .scene-item:hover { border-color: var(--accent); }
    .scene-item .meta { color: var(--dim); font-size: 12px; }
    .tbtn { padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); font-size: 13px; }
  </style>
</head>
<body>
  <div id="workspace">
    <!-- ============ Ribbon ============ -->
    <div id="ribbon">
      <div id="ribbon-tabs">
        <a class="brand-home" href="/" title="回平台首頁">J.S</a>
        <button class="rtab active" data-tab="home">首頁</button>
        <button class="rtab" data-tab="equip">設備</button>
        <button class="rtab" data-tab="pipe">管線</button>
        <button class="rtab" data-tab="view">檢視</button>
        <span id="scene-name">未儲存場景</span>
      </div>
      <div id="ribbon-body">
        <!-- 首頁 -->
        <div class="rpage active" data-page="home">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-save" title="儲存（Ctrl+S）"><span class="ric">💾</span>儲存</button>
              <button class="rbtn" id="btn-saveas" title="另存新場景"><span class="ric">⧉</span>另存</button>
              <button class="rbtn" id="btn-open" title="開啟既有場景"><span class="ric">📂</span>開啟</button>
              <button class="rbtn" id="btn-new" title="清空建立新場景"><span class="ric">✚</span>新增</button>
            </div>
            <div class="rgroup-label">場景</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-undo" disabled title="復原（Ctrl+Z）"><span class="ric">↶</span>復原</button>
              <button class="rbtn" id="btn-redo" disabled title="還原（Ctrl+Y）"><span class="ric">↷</span>還原</button>
            </div>
            <div class="rgroup-label">歷程</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn xf-btn active" data-m="translate" title="移動（W）"><span class="ric">⇄</span>移動</button>
              <button class="rbtn xf-btn" data-m="rotate" title="旋轉（E）"><span class="ric">⟳</span>旋轉</button>
              <button class="rbtn xf-btn" data-m="scale" title="縮放（R）"><span class="ric">⤢</span>縮放</button>
              <button class="rbtn" id="btn-del" title="刪除選取（Delete）"><span class="ric">🗑</span>刪除</button>
            </div>
            <div class="rgroup-label">修改</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <a class="rbtn" id="btn-view-twin" href="#" target="_blank" style="display:none"><span class="ric">👁</span>孿生檢視</a>
            </div>
            <div class="rgroup-label">交付</div>
          </div>
        </div>
        <!-- 設備（JS 依 ASSET_CATEGORIES 動態生成分類群組） -->
        <div class="rpage" data-page="equip" id="equip-ribbon"></div>
        <!-- 管線 -->
        <div class="rpage" data-page="pipe">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn warn" id="pipe-btn" title="依序點擊路徑點；Enter 完成"><span class="ric">╱</span>繪製管線</button>
              <label style="display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--dim)">管徑
                <input class="rsel" id="pipe-r" type="number" step="0.02" value="0.12" style="width:64px"> m
              </label>
            </div>
            <div class="rgroup-label">建立</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn warn" id="pipe-node-btn" title="選中管線後編輯節點：拖曳移動、Delete 刪節點"><span class="ric">◉</span>節點編輯</button>
            </div>
            <div class="rgroup-label">修改</div>
          </div>
        </div>
        <!-- 檢視 -->
        <div class="rpage" data-page="view">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" data-vp="iso" title="等角視">等角</button>
              <button class="rbtn" data-vp="top" title="俯視">俯視</button>
              <button class="rbtn" data-vp="front" title="前視">前視</button>
              <button class="rbtn" data-vp="right" title="右視">右視</button>
            </div>
            <div class="rgroup-label">視角</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-fit" title="縮放至全場景（Home）"><span class="ric">⛶</span>全場</button>
              <button class="rbtn" id="btn-fit-sel" title="縮放至選取（F）"><span class="ric">◎</span>選取</button>
            </div>
            <div class="rgroup-label">縮放</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn warn" id="btn-measure" title="點兩點量距離；Esc 結束"><span class="ric">📐</span>量測</button>
              <button class="rbtn" id="btn-clip" title="水平剖切面開關"><span class="ric">▤</span>剖切</button>
              <input type="range" id="clip-slider" min="0" max="100" value="100" style="width:90px;display:none">
            </div>
            <div class="rgroup-label">分析</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-underlay" title="P&ID 圖紙底圖顯示切換"><span class="ric">🗺</span>底圖</button>
              <button class="rbtn" id="btn-grid" title="地面網格顯示切換"><span class="ric">▦</span>網格</button>
              <button class="rbtn" id="btn-labels" title="設備位號標籤顯示切換"><span class="ric">🏷</span>標籤</button>
            </div>
            <div class="rgroup-label">顯示</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ Model Explorer ============ -->
    <aside id="tree-pane">
      <div class="pane-head">模型瀏覽器<button class="pane-x" id="tree-hide" title="收合">◀</button></div>
      <input id="tree-search" placeholder="搜尋位號 / 名稱…">
      <div id="model-tree"></div>
    </aside>

    <!-- ============ 3D 視圖 ============ -->
    <main id="viewport">
      <button class="pane-reopen" id="tree-reopen">☰ 模型樹</button>
      <button class="pane-reopen" id="prop-reopen">☰ 屬性</button>
      <div id="mode-hint">點選素材開始，或點擊場景中的設備編輯</div>
      <div id="measure-tip"></div>
      <canvas id="axis-triad"></canvas>
    </main>

    <!-- ============ Properties ============ -->
    <aside id="prop-pane">
      <div class="pane-head"><span id="prop-title">屬性</span><button class="pane-x" id="prop-hide" title="收合">▶</button></div>
      <div id="prop-body"><div id="prop-empty">未選取物件<br>點擊 3D 視圖或模型樹選取</div></div>
    </aside>

    <!-- ============ 狀態列 ============ -->
    <div id="statusbar">
      <span id="st-coords">X: — Y: — Z: —</span>
      <span id="st-sel">選取：無</span>
      <button class="st-toggle on" id="st-snap" title="放置/節點拖曳吸附 0.5m 網格">捕捉 0.5m</button>
      <span id="st-count"></span>
      <span style="margin-left:auto" id="st-mode">就緒</span>
    </div>
  </div>

  <div id="ctx-menu"></div>

  <div id="open-modal">
    <div class="modal-box">
      <div class="panel-title">開啟場景</div>
      <div id="scene-list"></div>
      <button class="tbtn" id="modal-close" style="width:100%;margin-top:8px">取消</button>
    </div>
  </div>

  <script type="module" src="/static/js/editor.js"></script>
</body>
</html>

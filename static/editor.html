<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 模塊編輯器｜J.S Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #0e141b; --panel: #131b24; --panel2: #17212c;
      --bdr: #223140; --accent: #46c2e0; --accent-deep: #1f6ea8;
      --text: #dbe5ee; --dim: #8ba0b3; --warn: #ffaa3c; --danger: #ff4d4f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 14px; }
    #viewport { position: absolute; inset: 0; }
    #viewport canvas { display: block; }

    #topbar {
      position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 30;
      display: flex; align-items: center; gap: 10px; padding: 0 14px;
      background: rgba(14, 20, 27, 0.92); border-bottom: 1px solid var(--bdr);
    }
    .brand-home {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px;
      background: rgba(70, 194, 224, 0.15); border: 1px solid var(--bdr);
      color: var(--accent); font-size: 11px; font-weight: 700; text-decoration: none;
    }
    .title { font-weight: 700; font-size: 15px; }
    #scene-name { color: var(--dim); font-size: 13px; }
    .spacer { flex: 1; }
    .tbtn {
      padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); font-size: 13px;
    }
    .tbtn:hover { border-color: var(--accent); }
    .tbtn.primary { background: var(--accent-deep); border-color: var(--accent); font-weight: 600; }

    .panel {
      position: absolute; z-index: 20; background: rgba(19, 27, 36, 0.94);
      border: 1px solid var(--bdr); border-radius: 12px; padding: 14px;
      backdrop-filter: blur(6px);
    }
    #asset-panel { top: 62px; left: 12px; width: 216px; max-height: calc(100vh - 90px); overflow-y: auto; }
    #asset-cats details { margin-bottom: 4px; }
    #asset-cats summary {
      cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text);
      padding: 7px 8px; border-radius: 7px; background: var(--panel2);
      border: 1px solid var(--bdr); list-style: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    #asset-cats summary::-webkit-details-marker { display: none; }
    #asset-cats summary:hover { border-color: var(--accent); }
    #asset-cats details[open] summary { color: var(--accent); }
    .cat-n { font-size: 10.5px; color: var(--dim); font-weight: 400; }
    #asset-cats .asset-grid { padding: 6px 0 4px; }
    .xf-group { display: inline-flex; gap: 0; border-radius: 8px; overflow: hidden; }
    .xf-group .tbtn { border-radius: 0; border-right-width: 0; }
    .xf-group .tbtn:first-child { border-radius: 8px 0 0 8px; }
    .xf-group .tbtn:last-child { border-radius: 0 8px 8px 0; border-right-width: 1px; }
    .xf-btn.active { background: var(--accent-deep); border-color: var(--accent); font-weight: 600; }
    .tbtn:disabled { opacity: 0.4; pointer-events: none; }
    .panel-title { font-size: 12px; font-weight: 700; color: var(--accent);
      letter-spacing: 1px; margin-bottom: 10px; }
    .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .asset-btn {
      padding: 10px 6px; border-radius: 8px; cursor: pointer; text-align: center;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text);
      font-size: 12.5px; font-family: inherit;
    }
    .asset-btn:hover { border-color: var(--accent); }
    .asset-btn.active { background: var(--accent-deep); border-color: var(--accent); }
    .tool-sep { border-top: 1px solid var(--bdr); margin: 12px 0; }
    #pipe-btn { width: 100%; }
    #pipe-btn.active { background: rgba(255, 170, 60, 0.25); border-color: var(--warn); }
    .hint { margin-top: 10px; font-size: 11px; color: var(--dim); line-height: 1.6; }

    #prop-panel { top: 62px; right: 12px; width: 240px; display: none; }
    #prop-panel.show { display: block; }
    .prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .prop-row label { font-size: 12px; color: var(--dim); }
    .prop-row input {
      width: 120px; padding: 5px 8px; border-radius: 6px; font-family: inherit;
      background: var(--bg); border: 1px solid var(--bdr); color: var(--text); font-size: 13px;
    }
    .prop-row input:focus { outline: none; border-color: var(--accent); }
    #prop-delete { width: 100%; margin-top: 6px; border-color: rgba(255, 77, 79, 0.5); color: var(--danger); }
    #prop-delete:hover { background: rgba(255, 77, 79, 0.12); }

    #mode-hint {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 25; padding: 8px 18px; border-radius: 20px; font-size: 13px;
      background: rgba(19, 27, 36, 0.94); border: 1px solid var(--bdr); color: var(--dim);
    }
    #mode-hint b { color: var(--accent); font-weight: 600; }

    #open-modal {
      position: absolute; inset: 0; z-index: 60; display: none;
      background: rgba(5, 9, 13, 0.7); align-items: center; justify-content: center;
    }
    #open-modal.show { display: flex; }
    .modal-box { width: 420px; background: var(--panel); border: 1px solid var(--bdr);
      border-radius: 12px; padding: 20px; }
    .scene-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
      background: var(--panel2); border: 1px solid var(--bdr);
    }
    .scene-item:hover { border-color: var(--accent); }
    .scene-item .meta { color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <header id="topbar">
    <a class="brand-home" href="/" title="回平台首頁">J.S</a>
    <span class="title">3D 模塊編輯器</span>
    <span id="scene-name">未儲存場景</span>
    <span class="spacer"></span>
    <button class="tbtn" id="btn-undo" disabled title="復原（Ctrl+Z）">復原</button>
    <button class="tbtn" id="btn-redo" disabled title="還原（Ctrl+Y）">還原</button>
    <span class="xf-group">
      <button class="tbtn xf-btn active" data-m="translate" title="移動（W）">移動</button>
      <button class="tbtn xf-btn" data-m="rotate" title="旋轉（E）">旋轉</button>
      <button class="tbtn xf-btn" data-m="scale" title="縮放（R）">縮放</button>
    </span>
    <button class="tbtn" id="btn-open">開啟</button>
    <button class="tbtn" id="btn-new">新增</button>
    <button class="tbtn" id="btn-saveas">另存</button>
    <button class="tbtn primary" id="btn-save">儲存</button>
    <a class="tbtn" id="btn-view" href="#" target="_blank" style="display:none">在孿生檢視開啟</a>
  </header>

  <aside id="asset-panel" class="panel">
    <div class="panel-title">工業素材</div>
    <div id="asset-cats"></div>
    <div class="tool-sep"></div>
    <button class="tbtn" id="pipe-btn">管線繪製</button>
    <div class="hint">
      點素材後點地面放置。<br>
      W 移動・E 旋轉・R 縮放<br>
      Delete 刪除・Esc 取消
    </div>
  </aside>

  <aside id="prop-panel" class="panel">
    <div class="panel-title" id="prop-title">屬性</div>
    <div id="prop-rows"></div>
    <button class="tbtn" id="prop-delete">刪除（Delete）</button>
  </aside>

  <div id="mode-hint">點選素材開始，或點擊場景中的設備編輯</div>

  <div id="open-modal">
    <div class="modal-box">
      <div class="panel-title">開啟場景</div>
      <div id="scene-list"></div>
      <button class="tbtn" id="modal-close" style="width:100%;margin-top:8px">取消</button>
    </div>
  </div>

  <main id="viewport"></main>
  <script type="module" src="/static/js/editor.js"></script>
</body>
</html>

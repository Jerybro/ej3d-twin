<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 設計工作區｜J.S Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #0e141b; --panel: #131b24; --panel2: #17212c; --panel3: #1b2733;
      --bdr: #223140; --accent: #46c2e0; --accent-deep: #1f6ea8;
      --text: #dbe5ee; --dim: #8ba0b3; --warn: #ffaa3c; --danger: #ff4d4f;
      --ribbon-h: 118px; --status-h: 26px; --vtabs-h: 24px; --tree-w: 236px; --prop-w: 250px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 13px; }

    /* ================= 停靠佈局（對標 E3D：ribbon/樹/屬性/狀態列） ===== */
    #workspace {
      display: grid; height: 100vh;
      grid-template-rows: var(--ribbon-h) 1fr var(--vtabs-h) var(--status-h);
      grid-template-columns: var(--tree-w) 1fr var(--prop-w);
      grid-template-areas: "ribbon ribbon ribbon" "tree view prop" "vtabs vtabs vtabs" "status status status";
    }
    body.tree-collapsed #workspace { grid-template-columns: 0 1fr var(--prop-w); }
    body.prop-collapsed #workspace { grid-template-columns: var(--tree-w) 1fr 0; }
    body.tree-collapsed.prop-collapsed #workspace { grid-template-columns: 0 1fr 0; }

    /* ================= Ribbon 功能區（QAT＋Tabs＋Body 三列） ================= */
    #ribbon { grid-area: ribbon; background: var(--panel); border-bottom: 1px solid var(--bdr);
      display: flex; flex-direction: column; user-select: none; }
    #qat { display: flex; align-items: center; height: 26px; padding: 0 8px; gap: 3px;
      background: var(--panel3); border-bottom: 1px solid var(--bdr); font-size: 12px; }
    .qbtn { width: 24px; height: 20px; border-radius: 4px; cursor: pointer; background: none;
      border: 1px solid transparent; color: var(--accent); font-size: 12px; line-height: 1; }
    .qbtn:hover { background: var(--panel2); border-color: var(--bdr); }
    .qbtn:disabled { opacity: 0.3; pointer-events: none; }
    #qat-discipline { margin-left: 10px; }
    #ribbon-tabs { display: flex; align-items: center; height: 30px; padding: 0 8px; gap: 2px;
      border-bottom: 1px solid var(--bdr); }
    .rtab-sep { width: 12px; }
    .rtab.hidden { display: none; }
    .brand-home {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 5px; margin-right: 8px;
      background: rgba(70, 194, 224, 0.15); border: 1px solid var(--bdr);
      color: var(--accent); font-size: 10px; font-weight: 700; text-decoration: none;
    }
    .rtab { padding: 5px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 12.5px;
      color: var(--dim); border: 1px solid transparent; border-bottom: none; background: none; font-family: inherit; }
    .rtab:hover { color: var(--text); }
    .rtab.active { color: var(--accent); background: var(--panel2); border-color: var(--bdr); font-weight: 600; }
    #scene-name { margin-left: auto; color: var(--dim); font-size: 12px; padding-right: 6px; }

    #ribbon-body { flex: 1; display: flex; align-items: stretch; padding: 4px 8px 5px; gap: 6px; overflow-x: auto; }
    .rgroup { display: flex; flex-direction: column; border-right: 1px solid var(--bdr); padding-right: 6px; }
    .rgroup:last-child { border-right: none; }
    .rgroup-tools { display: flex; gap: 4px; flex: 1; align-items: center; flex-wrap: wrap; max-height: 44px; }
    .rgroup-label { text-align: center; font-size: 10px; color: var(--dim); padding-top: 2px; letter-spacing: 1px; }
    .rbtn {
      min-width: 46px; padding: 4px 8px; border-radius: 6px; cursor: pointer; text-align: center;
      background: none; border: 1px solid transparent; color: var(--text); font-size: 11.5px; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.25;
    }
    .rbtn .ric { line-height: 0; }
    .ric svg { width: 17px; height: 17px; stroke: var(--accent); fill: none;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .ric.sm svg { width: 13px; height: 13px; }
    .qbtn .ric { line-height: 0; display: inline-block; }
    .rbtn:hover { background: var(--panel3); border-color: var(--bdr); }
    .rbtn.active { background: var(--accent-deep); border-color: var(--accent); }
    .rbtn.warn.active { background: rgba(255, 170, 60, 0.22); border-color: var(--warn); }
    .rbtn:disabled { opacity: 0.35; pointer-events: none; }
    .rsel { background: var(--panel2); border: 1px solid var(--bdr); color: var(--text);
      border-radius: 6px; padding: 4px 6px; font-family: inherit; font-size: 12px; max-width: 128px; }
    .rpage { display: none; flex: 1; }
    .rpage.active { display: flex; }

    /* ================= Model Explorer 模型樹 ================= */
    #tree-pane { grid-area: tree; background: var(--panel); border-right: 1px solid var(--bdr);
      display: flex; flex-direction: column; overflow: hidden; }
    .pane-head { display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-bottom: 1px solid var(--bdr); font-size: 12px; font-weight: 700;
      color: var(--accent); letter-spacing: 1px; flex-shrink: 0; }
    .pane-x { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0 3px; }
    .pane-x:hover { color: var(--accent); }
    #tree-search { margin: 6px 8px; padding: 5px 8px; background: var(--bg); color: var(--text);
      border: 1px solid var(--bdr); border-radius: 6px; font-family: inherit; font-size: 12px; flex-shrink: 0; }
    #tree-search:focus { outline: none; border-color: var(--accent); }
    #model-tree { flex: 1; overflow-y: auto; padding: 2px 4px 10px; }
    .mt-unit > summary { list-style: none; cursor: pointer; padding: 4px 6px; border-radius: 5px;
      font-size: 11.5px; color: var(--dim); display: flex; align-items: center; gap: 5px; }
    .mt-unit > summary::-webkit-details-marker { display: none; }
    .mt-unit > summary:hover { background: var(--panel3); }
    .mt-unit > summary .tw { transition: transform .12s; font-size: 9px; }
    .mt-unit[open] > summary .tw { transform: rotate(90deg); }
    .mt-eq { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 20px;
      border-radius: 5px; cursor: pointer; font-size: 12px; }
    .mt-eq:hover { background: var(--panel3); }
    .mt-eq.selected { background: var(--accent-deep); }
    .mt-eq.hidden-eq { opacity: 0.4; }
    .mt-ico { width: 14px; text-align: center; color: var(--accent); font-size: 10px; flex-shrink: 0; }
    .mt-tag { font-weight: 600; white-space: nowrap; }
    .mt-name { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ================= Properties 屬性格 ================= */
    #prop-pane { grid-area: prop; background: var(--panel); border-left: 1px solid var(--bdr);
      display: flex; flex-direction: column; overflow: hidden; }
    #prop-body { flex: 1; overflow-y: auto; padding: 8px; }
    .pg-section { font-size: 10.5px; color: var(--dim); letter-spacing: 1px; margin: 10px 2px 4px; }
    .pg-grid { display: grid; grid-template-columns: 88px 1fr; border: 1px solid var(--bdr); border-radius: 7px; overflow: hidden; }
    .pg-grid > label { padding: 6px 8px; background: var(--panel2); font-size: 11.5px; color: var(--dim);
      border-bottom: 1px solid var(--bdr); display: flex; align-items: center; }
    .pg-grid > .pg-v { padding: 3px; border-bottom: 1px solid var(--bdr); }
    .pg-grid > label:last-of-type, .pg-grid > .pg-v:last-of-type { border-bottom: none; }
    .pg-v input, .pg-v span { width: 100%; padding: 4px 6px; background: var(--bg); color: var(--text);
      border: 1px solid transparent; border-radius: 5px; font-family: inherit; font-size: 12.5px; display: block; }
    .pg-v span { background: none; color: var(--dim); }
    .pg-v input:hover { border-color: var(--bdr); }
    .pg-v input:focus { outline: none; border-color: var(--accent); background: var(--panel2); }
    .pbtn { width: 100%; margin-top: 8px; padding: 7px; border-radius: 7px; cursor: pointer;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); font-family: inherit; font-size: 12.5px; }
    .pbtn:hover { border-color: var(--accent); }
    .pbtn.danger { color: var(--danger); border-color: rgba(255, 77, 79, 0.4); }
    .pbtn.danger:hover { background: rgba(255, 77, 79, 0.12); }
    #prop-empty { color: var(--dim); font-size: 12px; text-align: center; margin-top: 30px; line-height: 1.8; }

    /* ================= 3D 視圖 ================= */
    #viewport { grid-area: view; position: relative; overflow: hidden; }
    #viewport canvas { display: block; }
    #axis-triad { position: absolute; right: 10px; bottom: 8px; width: 84px; height: 84px;
      z-index: 5; pointer-events: none; }

    /* CE 麵包屑（E3D 頂部路徑列） */
    #ce-breadcrumb { position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 22;
      display: flex; align-items: center; gap: 4px; padding: 0 10px;
      background: rgba(19, 27, 36, 0.92); border-bottom: 1px solid var(--bdr);
      font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; }
    #ce-breadcrumb .bc-seg { cursor: pointer; padding: 1px 4px; border-radius: 4px; }
    #ce-breadcrumb .bc-seg:hover { color: var(--accent); background: var(--panel3); }
    #ce-breadcrumb .bc-type { color: var(--accent); font-family: Consolas, monospace; font-size: 10px; margin-right: 2px; }
    #ce-breadcrumb .bc-sep { color: var(--bdr); }

    /* PowerCompass（E3D 球形方位羅盤，可拖曳） */
    #power-compass { position: absolute; left: 12px; bottom: 46px; width: 96px; height: 96px;
      z-index: 24; cursor: grab; user-select: none; }
    #power-compass svg { width: 100%; height: 100%; }
    #power-compass .pc-hot { cursor: pointer; }
    #power-compass .pc-hot:hover circle { fill: rgba(70, 194, 224, 0.35); }
    #power-compass .pc-hot text { fill: var(--text); font-size: 13px; font-weight: 700; }

    /* 模型樹 DB 型別字（WORL/SITE/ZONE/EQUI/PIPE） */
    .mt-dbtype { font-family: Consolas, monospace; font-size: 10px; color: var(--dim);
      letter-spacing: 0.5px; margin-right: 3px; flex-shrink: 0; }
    .mt-eq.selected .mt-dbtype { color: rgba(255,255,255,.75); }

    /* 底部視圖分頁列 */
    #vtabs { grid-area: vtabs; display: flex; align-items: stretch; gap: 2px; padding: 0 8px;
      background: var(--panel); border-top: 1px solid var(--bdr); user-select: none; }
    .vtab { display: flex; align-items: center; padding: 0 14px; font-size: 11.5px;
      color: var(--accent); background: var(--panel2); border: 1px solid var(--bdr); border-top: none;
      border-radius: 0 0 6px 6px; font-weight: 600; }
    .vtab-add { align-self: center; margin-left: 4px; width: 20px; height: 18px; border-radius: 4px;
      background: none; border: 1px solid var(--bdr); color: var(--dim); font-size: 12px;
      line-height: 1; opacity: 0.5; }
    /* Prompt Area：E3D 提示固定左下，不浮動置中 */
    #mode-hint {
      position: absolute; bottom: 12px; left: 12px;
      z-index: 25; padding: 6px 14px; border-radius: 8px; font-size: 12.5px;
      background: rgba(19, 27, 36, 0.94); border: 1px solid var(--bdr); color: var(--dim);
      max-width: 46%; text-align: left;
    }
    #mode-hint b { color: var(--accent); font-weight: 600; }
    #measure-tip { position: absolute; z-index: 26; padding: 3px 9px; border-radius: 10px;
      background: rgba(255, 170, 60, 0.92); color: #1a1204; font-size: 12px; font-weight: 700;
      pointer-events: none; display: none; }
    .pane-reopen { position: absolute; top: 8px; z-index: 24; padding: 5px 9px; border-radius: 7px;
      cursor: pointer; background: rgba(19, 27, 36, 0.92); border: 1px solid var(--bdr);
      color: var(--dim); font-family: inherit; font-size: 11.5px; display: none; }
    .pane-reopen:hover { color: var(--accent); border-color: var(--accent); }
    #tree-reopen { left: 8px; }
    #prop-reopen { right: 8px; }
    body.tree-collapsed #tree-reopen { display: block; }
    body.prop-collapsed #prop-reopen { display: block; }

    /* 右鍵情境選單 */
    #ctx-menu { position: fixed; z-index: 80; display: none; min-width: 150px;
      background: var(--panel); border: 1px solid var(--bdr); border-radius: 8px; padding: 4px;
      box-shadow: 0 8px 28px rgba(0,0,0,.5); }
    #ctx-menu button { display: block; width: 100%; text-align: left; padding: 7px 12px;
      background: none; border: none; color: var(--text); font-family: inherit; font-size: 12.5px;
      border-radius: 5px; cursor: pointer; }
    #ctx-menu button:hover { background: var(--accent-deep); }
    #ctx-menu button.danger { color: var(--danger); }
    #ctx-menu .ctx-sep { border-top: 1px solid var(--bdr); margin: 4px 6px; }
    .ctx-sub { position: relative; }
    .ctx-sub > button::after { content: '›'; float: right; color: var(--dim); }
    .ctx-sub-menu { position: absolute; left: 100%; top: -4px; display: none; min-width: 110px;
      background: var(--panel); border: 1px solid var(--bdr); border-radius: 8px; padding: 4px;
      box-shadow: 0 8px 28px rgba(0,0,0,.5); }
    .ctx-sub:hover > .ctx-sub-menu { display: block; }

    /* 量測持久標註 */
    .m-note { padding: 2px 9px; border-radius: 10px; background: rgba(255, 170, 60, 0.92);
      color: #1a1204; font-size: 12px; font-weight: 700; white-space: nowrap; pointer-events: none; }

    /* 剖切盒面手柄（CSS2D） */
    .clip-handle { width: 14px; height: 14px; border-radius: 3px; background: rgba(70,194,224,.85);
      border: 1px solid #0e141b; cursor: grab; pointer-events: auto; }
    .clip-handle:hover { background: var(--warn); }

    /* PowerWheel 放射狀選單（E3D 3D 視圖右鍵） */
    #power-wheel { position: fixed; z-index: 82; width: 230px; height: 230px; display: none; }
    #power-wheel.show { display: block; }
    .pw-tile {
      position: absolute; width: 64px; height: 64px; margin: -32px; left: 50%; top: 50%;
      border-radius: 50%; background: rgba(19, 27, 36, 0.96); border: 1px solid var(--bdr);
      color: var(--text); font-size: 11px; font-family: inherit; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); transition: transform .1s, border-color .1s;
      line-height: 1.15; text-align: center; padding: 4px;
    }
    .pw-tile:hover { border-color: var(--accent); background: var(--panel3); transform: scale(1.08); }
    .pw-tile.danger { color: var(--danger); }
    .pw-center {
      position: absolute; width: 44px; height: 44px; margin: -22px; left: 50%; top: 50%;
      border-radius: 50%; background: var(--panel2); border: 1px solid var(--bdr);
      color: var(--dim); font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .pw-center:hover { color: var(--danger); border-color: var(--danger); }

    /* Clash 底部面板 */
    #clash-dock { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; z-index: 26;
      background: rgba(19, 27, 36, 0.96); border-top: 1px solid var(--bdr); display: none;
      flex-direction: column; }
    #clash-dock.show { display: flex; }
    #clash-dock .pane-head { flex-shrink: 0; }
    #clash-list { flex: 1; overflow-y: auto; font-size: 12px; }
    .clash-row { display: grid; grid-template-columns: 74px 1fr 1fr 1fr; gap: 8px; padding: 4px 12px;
      cursor: pointer; border-bottom: 1px solid rgba(34,49,64,.5); align-items: center; }
    .clash-row:hover { background: var(--panel3); }
    .clash-row.selected { background: var(--accent-deep); }
    .clash-badge { font-size: 10.5px; font-weight: 700; text-align: center; border-radius: 8px; padding: 1px 6px; }
    .clash-badge.overlap { background: rgba(255,77,79,.25); color: #ff8a8c; }
    .clash-badge.touch { background: rgba(255,170,60,.22); color: var(--warn); }
    .clash-badge.pipe { background: rgba(70,194,224,.18); color: var(--accent); }

    /* ================= 狀態列 ================= */
    #statusbar { grid-area: status; display: flex; align-items: center; gap: 18px; padding: 0 12px;
      background: var(--panel); border-top: 1px solid var(--bdr); font-size: 11.5px; color: var(--dim);
      user-select: none; white-space: nowrap; overflow: hidden; }
    #statusbar b { color: var(--text); font-weight: 600; }
    .st-toggle { cursor: pointer; padding: 1px 8px; border-radius: 5px; border: 1px solid var(--bdr);
      background: none; color: var(--dim); font-family: inherit; font-size: 11px; }
    .st-toggle.on { color: var(--accent); border-color: var(--accent); }
    #st-coords { min-width: 210px; }

    /* ================= 開啟場景 modal ================= */
    #open-modal { position: fixed; inset: 0; z-index: 90; display: none;
      background: rgba(5, 9, 13, 0.7); align-items: center; justify-content: center; }
    #open-modal.show { display: flex; }
    .modal-box { width: 440px; max-height: 70vh; overflow-y: auto; background: var(--panel);
      border: 1px solid var(--bdr); border-radius: 12px; padding: 20px; }
    .panel-title { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-bottom: 10px; }
    .scene-item { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
      background: var(--panel2); border: 1px solid var(--bdr); }
    .scene-item:hover { border-color: var(--accent); }
    .scene-item .meta { color: var(--dim); font-size: 12px; }
    .tbtn { padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); font-size: 13px; }
  </style>
</head>
<body>
  <div id="workspace">
    <!-- ============ Ribbon（QAT＋Tabs＋Body） ============ -->
    <div id="ribbon">
      <div id="qat">
        <a class="brand-home" href="/" title="回平台首頁">J.S</a>
        <button class="qbtn" id="qat-save" title="儲存（Ctrl+S）"><span class="ric sm" data-ic="save"></span></button>
        <button class="qbtn" id="qat-saveas" title="另存"><span class="ric sm" data-ic="saveas"></span></button>
        <button class="qbtn" id="qat-undo" disabled title="復原（Ctrl+Z）"><span class="ric sm" data-ic="undo"></span></button>
        <button class="qbtn" id="qat-redo" disabled title="還原（Ctrl+Y）"><span class="ric sm" data-ic="redo"></span></button>
        <select class="rsel" id="qat-discipline" title="專業領域（Discipline）——切換情境功能頁籤">
          <option value="pipe" selected>管線 PIPING</option>
          <option value="equip">設備 EQUIPMENT</option>
          <option value="struct">結構 STRUCTURES</option>
          <option value="none">通用 GENERAL</option>
        </select>
        <span id="scene-name" style="margin-left:auto">未儲存場景</span>
      </div>
      <div id="ribbon-tabs">
        <button class="rtab" data-tab="project">專案</button>
        <button class="rtab active" data-tab="home">首頁</button>
        <button class="rtab" data-tab="view">檢視</button>
        <button class="rtab" data-tab="tools">工具</button>
        <span class="rtab-sep"></span>
        <button class="rtab ctx-tab" data-tab="equip">設備 EQUIPMENT</button>
        <button class="rtab ctx-tab" data-tab="pipe">管線 PIPING</button>
      </div>
      <div id="ribbon-body">
        <!-- 專案 PROJECT -->
        <div class="rpage" data-page="project">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-save" title="儲存（Ctrl+S）"><span class="ric" data-ic="save"></span>儲存</button>
              <button class="rbtn" id="btn-saveas" title="另存新場景"><span class="ric" data-ic="saveas"></span>另存</button>
              <button class="rbtn" id="btn-open" title="開啟既有場景"><span class="ric" data-ic="open"></span>開啟</button>
              <button class="rbtn" id="btn-new" title="清空建立新場景"><span class="ric" data-ic="new"></span>新增</button>
            </div>
            <div class="rgroup-label">場景</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <a class="rbtn" id="btn-view-twin" href="#" target="_blank" style="display:none"><span class="ric" data-ic="eye"></span>孿生檢視</a>
              <button class="rbtn" id="btn-ga" title="輸出俯視配置圖（GA Plot Plan，SVG 可列印）"><span class="ric" data-ic="ga"></span>出圖 GA</button>
            </div>
            <div class="rgroup-label">交付</div>
          </div>
        </div>
        <!-- 首頁 HOME -->
        <div class="rpage active" data-page="home">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-undo" disabled title="復原（Ctrl+Z）"><span class="ric" data-ic="undo"></span>復原</button>
              <button class="rbtn" id="btn-redo" disabled title="還原（Ctrl+Y）"><span class="ric" data-ic="redo"></span>還原</button>
              <button class="rbtn" id="btn-del" title="刪除選取（Delete）"><span class="ric" data-ic="del"></span>刪除</button>
            </div>
            <div class="rgroup-label">共用</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-fit-sel" title="縮放至選取（F）"><span class="ric" data-ic="fitsel"></span>至選取</button>
              <button class="rbtn" id="btn-fit" title="縮放至全場景（Home）"><span class="ric" data-ic="fitall"></span>全場</button>
            </div>
            <div class="rgroup-label">巡覽</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn warn" id="btn-measure" title="點兩點量距離（可連續；空白鍵重複上次量測）；Esc 結束"><span class="ric" data-ic="measure"></span>距離</button>
              <button class="rbtn warn" id="btn-measure-angle" title="點三點量角度（第一點＝頂點）；Esc 結束"><span class="ric" data-ic="angle"></span>角度</button>
            </div>
            <div class="rgroup-label">量測</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn xf-btn active" data-m="translate" title="移動（W）"><span class="ric" data-ic="move"></span>移動</button>
              <button class="rbtn xf-btn" data-m="rotate" title="旋轉（E）"><span class="ric" data-ic="rotate"></span>旋轉</button>
              <button class="rbtn xf-btn" data-m="scale" title="縮放（R）"><span class="ric" data-ic="scale"></span>縮放</button>
            </div>
            <div class="rgroup-label">修改</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-win-tree" title="模型瀏覽器開關"><span class="ric" data-ic="tree"></span>模型樹</button>
              <button class="rbtn" id="btn-win-prop" title="屬性面板開關"><span class="ric" data-ic="panel"></span>屬性</button>
            </div>
            <div class="rgroup-label">視窗</div>
          </div>
        </div>
        <!-- 設備（JS 依 ASSET_CATEGORIES 動態生成分類群組） -->
        <div class="rpage" data-page="equip" id="equip-ribbon"></div>
        <!-- 管線 -->
        <div class="rpage" data-page="pipe">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn warn" id="pipe-btn" title="依序點擊路徑點；Enter 完成"><span class="ric" data-ic="pipe"></span>繪製管線</button>
              <label style="display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--dim)">管徑
                <input class="rsel" id="pipe-r" type="number" step="0.02" value="0.12" style="width:64px"> m
              </label>
            </div>
            <div class="rgroup-label">建立</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn warn" id="pipe-node-btn" title="選中管線後編輯節點：拖曳移動、Delete 刪節點"><span class="ric" data-ic="node"></span>節點編輯</button>
            </div>
            <div class="rgroup-label">修改</div>
          </div>
        </div>
        <!-- 檢視 VIEW -->
        <div class="rpage" data-page="view">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-underlay" title="P&ID 圖紙底圖顯示切換"><span class="ric" data-ic="map"></span>底圖</button>
              <button class="rbtn" id="btn-grid" title="地面網格顯示切換"><span class="ric" data-ic="grid"></span>網格</button>
              <button class="rbtn" id="btn-labels" title="設備位號標籤顯示切換"><span class="ric" data-ic="label"></span>標籤</button>
            </div>
            <div class="rgroup-label">內容</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" data-vp="n" title="看向北">北</button>
              <button class="rbtn" data-vp="s" title="看向南">南</button>
              <button class="rbtn" data-vp="e" title="看向東">東</button>
              <button class="rbtn" data-vp="w" title="看向西">西</button>
              <button class="rbtn" data-vp="top" title="俯視">俯視</button>
              <button class="rbtn" data-vp="iso" title="等角視">等角</button>
            </div>
            <div class="rgroup-label">視向</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-view-save" title="儲存目前視角（含隱藏清單與縮圖）"><span class="ric" data-ic="pin"></span>存視角</button>
              <button class="rbtn" id="btn-view-restore" title="視角書籤清單（屬性面板開啟）"><span class="ric" data-ic="bookmark"></span>回視角</button>
              <button class="rbtn warn" id="btn-walk" title="第一人稱漫遊：WASD 移動、Shift 加速、Esc 離開"><span class="ric" data-ic="walk"></span>漫遊</button>
            </div>
            <div class="rgroup-label">操縱</div>
          </div>
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn" id="btn-clipbox" title="剖切盒：全場範圍生成，拖面手柄調整"><span class="ric" data-ic="clipbox"></span>剖切盒</button>
              <button class="rbtn" id="btn-clipbox-sel" title="以目前選取生成剖切盒（±1m）"><span class="ric" data-ic="clipsel"></span>從選取</button>
              <button class="rbtn" id="btn-clipsix" title="六平面剖切：屬性面板逐面調整"><span class="ric" data-ic="clipsix"></span>六平面</button>
              <button class="rbtn" id="btn-clipclear" title="清除剖切"><span class="ric" data-ic="clear"></span>清除</button>
            </div>
            <div class="rgroup-label">剖切</div>
          </div>
        </div>
        <!-- 工具 TOOLS -->
        <div class="rpage" data-page="tools">
          <div class="rgroup">
            <div class="rgroup-tools">
              <button class="rbtn warn" id="btn-clash-run" title="全場景碰撞檢查：設備硬碰撞/淨距不足/管線干涉"><span class="ric" data-ic="alert"></span>檢查全部</button>
              <span id="clash-summary" style="font-size:11.5px;color:var(--dim);align-self:center"></span>
            </div>
            <div class="rgroup-label">碰撞</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ Model Explorer ============ -->
    <aside id="tree-pane">
      <div class="pane-head">模型瀏覽器<button class="pane-x" id="tree-hide" title="收合">◀</button></div>
      <input id="tree-search" placeholder="搜尋位號 / 名稱…">
      <div id="model-tree"></div>
    </aside>

    <!-- ============ 3D 視圖 ============ -->
    <main id="viewport">
      <div id="ce-breadcrumb"></div>
      <button class="pane-reopen" id="tree-reopen" style="top:32px">☰ 模型樹</button>
      <button class="pane-reopen" id="prop-reopen" style="top:32px">☰ 屬性</button>
      <div id="mode-hint">點選素材開始，或點擊場景中的設備編輯</div>
      <div id="measure-tip"></div>
      <canvas id="axis-triad"></canvas>
      <div id="clash-dock">
        <div class="pane-head">碰撞檢查結果<span id="clash-count" style="color:var(--dim);font-weight:400"></span>
          <button class="pane-x" id="clash-close" title="關閉">✕</button></div>
        <div id="clash-list"></div>
      </div>
      <div id="power-compass" title="方位羅盤：點 N/S/E/W 切視向、U 俯視、D 仰視；可拖曳移位">
        <svg viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="45" fill="rgba(19,27,36,.85)" stroke="#223140" stroke-width="1.5"/>
          <circle cx="48" cy="48" r="30" fill="none" stroke="#223140" stroke-width="1"/>
          <g id="pc-rose">
            <g class="pc-hot" data-vp="n"><circle cx="48" cy="12" r="10" fill="rgba(70,194,224,.12)"/><text x="48" y="17" text-anchor="middle">N</text></g>
            <g class="pc-hot" data-vp="s"><circle cx="48" cy="84" r="10" fill="rgba(70,194,224,.12)"/><text x="48" y="89" text-anchor="middle">S</text></g>
            <g class="pc-hot" data-vp="e"><circle cx="84" cy="48" r="10" fill="rgba(70,194,224,.12)"/><text x="84" y="53" text-anchor="middle">E</text></g>
            <g class="pc-hot" data-vp="w"><circle cx="12" cy="48" r="10" fill="rgba(70,194,224,.12)"/><text x="12" y="53" text-anchor="middle">W</text></g>
          </g>
          <g class="pc-hot" data-vp="top"><circle cx="48" cy="38" r="8" fill="rgba(70,194,224,.12)"/><text x="48" y="42" text-anchor="middle" font-size="10">U</text></g>
          <g class="pc-hot" data-vp="bottom"><circle cx="48" cy="58" r="8" fill="rgba(70,194,224,.12)"/><text x="48" y="62" text-anchor="middle" font-size="10">D</text></g>
        </svg>
      </div>
    </main>

    <!-- ============ Properties ============ -->
    <aside id="prop-pane">
      <div class="pane-head"><span id="prop-title">屬性</span><button class="pane-x" id="prop-hide" title="收合">▶</button></div>
      <div id="prop-body"><div id="prop-empty">未選取物件<br>點擊 3D 視圖或模型樹選取</div></div>
    </aside>

    <!-- ============ 視圖分頁列 ============ -->
    <div id="vtabs">
      <div class="vtab">3D View (1)</div>
      <button class="vtab-add" disabled title="多視圖規劃中">＋</button>
    </div>

    <!-- ============ 狀態列 ============ -->
    <div id="statusbar">
      <span id="st-coords">X: — Y: — Z: —</span>
      <span id="st-sel">選取：無</span>
      <button class="st-toggle on" id="st-snap" title="放置/節點拖曳吸附 0.5m 網格">捕捉 0.5m</button>
      <span id="st-count"></span>
      <span id="st-nav" title="中鍵按住＝目前導航模式；F2 縮放、F3 平移、F5 旋轉">MB2：旋轉</span>
      <span style="margin-left:auto" id="st-mode">就緒</span>
    </div>
  </div>

  <div id="ctx-menu"></div>
  <div id="power-wheel"></div>

  <div id="open-modal">
    <div class="modal-box">
      <div class="panel-title">開啟場景</div>
      <div id="scene-list"></div>
      <button class="tbtn" id="modal-close" style="width:100%;margin-top:8px">取消</button>
    </div>
  </div>

  <script type="module" src="/static/js/editor.js"></script>
</body>
</html>

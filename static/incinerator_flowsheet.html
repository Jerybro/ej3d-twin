<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flowsheet 工程檢視｜J.S Process Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* 產品統一藍白殼（與首頁 / 模型 API 控制台同一套 design token） */
  :root{
    --blue:#046AFB; --bg:#F6F7FA; --white:#fff; --bdr:#DBDDE0;
    --text:#061027; --text2:#555; --green:#059669; --green-deep:#052E22;
    --amber:#B45309; --red:#C0392B;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-size:14px;
       font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 28px 56px;}
  header.site{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .brand{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 10px;
         border-radius:8px;background:var(--green-deep);color:#fff;font-size:13px;font-weight:600;letter-spacing:.5px;}
  .logo{font-size:19px;font-weight:600;}
  .site-sub{color:var(--text2);font-size:13px;}
  .hdr-actions{margin-left:auto;display:flex;gap:8px;}
  .hbtn{font-size:13px;color:var(--text);text-decoration:none;border:1px solid var(--bdr);border-radius:7px;
        padding:7px 12px;background:var(--white);cursor:pointer;font-family:inherit;}
  .hbtn:hover{border-color:var(--blue);color:var(--blue);}
  h1{font-size:21px;font-weight:600;margin:12px 0 3px;}
  .sub{color:var(--text2);font-size:13px;margin-bottom:16px;line-height:1.8;}
  .sub code{background:var(--white);border:1px solid var(--bdr);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:11.5px;}

  /* 情境列（chip 膠囊，與 3D 檢視器頂欄同語言） */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .bar .lbl{color:var(--text2);font-size:12px;font-weight:700;margin-right:2px;}
  .bar button{padding:6px 14px;border-radius:16px;border:1px solid var(--bdr);background:var(--white);
       color:var(--text);font-size:12.5px;cursor:pointer;font-family:inherit;}
  .bar button:hover{border-color:var(--blue);}
  .bar button.active{background:rgba(4,106,251,.08);border-color:var(--blue);color:var(--blue);font-weight:700;}
  .hz{font-size:12px;color:var(--text2);}

  /* 操作設點卡 */
  .ctrls{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;background:var(--white);
         border:1px solid var(--bdr);border-radius:10px;padding:14px 18px;margin-bottom:16px;}
  .ctrls:empty{display:none;}
  .ctrl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text2);min-width:180px;}
  .ctrl b{color:var(--text);font-size:13px;font-weight:600;}
  .ctrl .cv{color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums;}
  .ctrl input[type=range]{width:100%;accent-color:var(--blue);}
  .ctrl .opt{margin-top:6px;padding:5px 10px;font-size:11.5px;border:1px solid var(--bdr);border-radius:7px;
       background:rgba(4,106,251,.06);color:var(--blue);cursor:pointer;font-family:inherit;}
  .ctrl .opt:hover{border-color:var(--blue);}

  /* KPI 列 */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{background:var(--white);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;}
  .kpi .k{font-size:11.5px;color:var(--text2);}
  .kpi .v{font-size:20px;font-weight:700;margin-top:2px;color:var(--text);font-variant-numeric:tabular-nums;}
  .kpi .unit{font-size:11px;color:var(--text2);font-weight:400;}

  /* flowsheet：一條 train 一列 */
  .group-title{font-size:12.5px;color:var(--text2);letter-spacing:1px;margin:6px 0 8px;font-weight:600;}
  .flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 12px;}
  .flow.branch{padding-left:64px;}
  .trainlbl{color:var(--text2);font-size:11px;margin:0 0 2px 8px;}
  .blk{flex:0 0 158px;background:var(--white);border:1px solid var(--bdr);border-radius:10px;
       padding:12px 13px;position:relative;transition:border-color .35s, box-shadow .35s;}
  .blk.gd-warn{border-color:var(--amber);box-shadow:0 0 0 1px rgba(180,83,9,.25);}
  .blk.gd-out{border-color:var(--red);box-shadow:0 0 0 1px rgba(192,57,43,.3);}
  .blk.err{opacity:.5;filter:grayscale(.6);}
  .blk.ref{opacity:.6;border-style:dashed;flex-basis:118px;}
  .blk .icw{width:34px;height:34px;border-radius:9px;background:rgba(4,106,251,.08);
       display:flex;align-items:center;justify-content:center;margin-bottom:7px;}
  .blk .icw svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .blk.anom .icw{background:rgba(5,150,105,.09);}
  .blk.anom .icw svg{stroke:var(--green);}
  .blk .tag{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.02em;}
  .blk .nm{font-size:12.5px;font-weight:500;margin:1px 0 7px;line-height:1.3;min-height:31px;color:var(--text);}
  .blk.ref .nm{min-height:auto;margin-bottom:0;}
  .badge{display:inline-block;font-size:10px;padding:1px 8px;border-radius:999px;font-weight:700;}
  .b-predict{background:rgba(4,106,251,.09);color:var(--blue);}
  .b-health{background:rgba(5,150,105,.10);color:var(--green);}
  .lbl2{font-size:10.5px;color:var(--text2);margin-top:8px;}
  .val{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1;color:var(--text);}
  .unit{font-size:11px;color:var(--text2);font-weight:400;}
  .st{display:inline-block;margin-top:9px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .st.ok{background:rgba(5,150,105,.10);color:var(--green);}
  .st.warn{background:rgba(180,83,9,.12);color:var(--amber);}
  .st.crit{background:rgba(192,57,43,.10);color:var(--red);}
  .st.na{background:#EEF0F3;color:var(--text2);}
  .key{position:absolute;top:11px;right:11px;width:9px;height:9px;border-radius:50%;background:#C9CFD6;}
  .mk{font-size:9.5px;color:#9AA3AE;margin-top:9px;word-break:break-all;font-family:var(--mono);}
  .arrow{flex:0 0 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#B9C1CB;font-size:17px;gap:4px;}
  .arrow.cn{flex-basis:104px;}
  .ar-lbl{font-size:10px;color:var(--text2);text-align:center;line-height:1.3;background:var(--white);
          border:1px solid var(--bdr);border-radius:7px;padding:2px 7px;max-width:108px;word-break:break-word;}
  .ar-lbl b{color:var(--blue);font-weight:700;}
  .legend{font-size:11px;color:var(--text2);margin:2px 0 14px;display:flex;gap:14px;flex-wrap:wrap;}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* 呼叫紀錄（預設收合） */
  details.logbox{background:var(--white);border:1px solid var(--bdr);border-radius:10px;padding:12px 16px;margin-top:4px;}
  details.logbox summary{font-size:12.5px;color:var(--text2);font-weight:600;cursor:pointer;user-select:none;}
  #log{font-size:11.5px;font-family:var(--mono);color:var(--text2);height:190px;overflow-y:auto;margin-top:10px;
       background:#FAFBFC;border:1px solid var(--bdr);border-radius:8px;padding:8px 10px;white-space:pre-wrap;}
  .bootfail{background:var(--white);border:1px solid var(--bdr);border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.8;}
  .bootfail .mut{color:var(--text2);font-size:12px;}
  .bootfail button{margin-top:8px;padding:7px 14px;border:1px solid var(--bdr);border-radius:7px;background:var(--white);cursor:pointer;font-family:inherit;}
  .bootfail button:hover{border-color:var(--blue);color:var(--blue);}

  /* 自訂顯示抽屜 */
  #drawer{position:fixed;top:0;right:-360px;width:352px;height:100%;background:var(--white);
          border-left:1px solid var(--bdr);box-shadow:-8px 0 30px rgba(6,16,39,.10);z-index:50;
          transition:right .25s ease;overflow-y:auto;padding:18px 18px 30px;}
  #drawer.open{right:0;}
  #drawer h2{font-size:15px;font-weight:600;margin-bottom:2px;}
  #drawer .dsub{font-size:11.5px;color:var(--text2);margin-bottom:14px;line-height:1.6;}
  #drawer .dclose{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--text2);cursor:pointer;}
  .dglobal{border:1px solid var(--bdr);border-radius:9px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;}
  .dglobal label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;}
  .dglobal input{accent-color:var(--blue);}
  .dblk{border:1px solid var(--bdr);border-radius:9px;padding:10px 12px;margin-bottom:10px;}
  .dblk .dhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .dblk .dhead .tag{font-size:12px;color:var(--blue);font-weight:700;}
  .dblk .dhead label{margin-left:auto;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px;cursor:pointer;}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .dgrid .full{grid-column:1/-1;}
  .df{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--text2);}
  .df input,.df select{padding:5px 7px;border:1px solid var(--bdr);border-radius:6px;font-size:12px;font-family:inherit;color:var(--text);background:var(--white);width:100%;}
  .dreset{width:100%;margin-top:6px;padding:8px;border:1px solid var(--bdr);border-radius:8px;background:var(--white);
          color:var(--red);font-size:12.5px;cursor:pointer;font-family:inherit;}
  .dreset:hover{border-color:var(--red);}
  .dhint{font-size:10.5px;color:var(--text2);margin-top:10px;line-height:1.6;}

  /* 檢視切換（卡片⇄組態） */
  .viewseg{display:inline-flex;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;margin-left:10px;}
  .viewseg button{border:none;background:var(--white);color:var(--text2);font-size:12px;
      padding:6px 13px;cursor:pointer;font-family:inherit;}
  .viewseg button.on{background:rgba(4,106,251,.09);color:var(--blue);font-weight:700;}

  /* 組態畫面（PI Vision 式運轉圖）：灰底畫布＋圖符＋數值框＋KPI 面板 */
  #mimic{background:#E7EAEE;border:1px solid var(--bdr);border-radius:10px;padding:8px;overflow-x:auto;}
  #mimic svg{display:block;min-width:860px;width:100%;height:auto;font-family:Inter,"Noto Sans TC",sans-serif;}
  #mimic .sym{stroke:#46525E;stroke-width:1.6;fill:#FDFEFE;stroke-linecap:round;stroke-linejoin:round;}
  #mimic .pipe{stroke:#8A939E;stroke-width:3;fill:none;}
  #mimic .mtag{font-size:10.5px;font-weight:700;fill:#046AFB;}
  #mimic .mnm{font-size:9.5px;fill:#5C6773;}
  #mimic .vbox{fill:#fff;stroke:#9AA3AE;stroke-width:1;}
  #mimic .vbox.warn{stroke:#B45309;stroke-width:1.6;}
  #mimic .vbox.crit{stroke:#C0392B;stroke-width:1.8;}
  #mimic .vtxt{font-size:12px;font-weight:700;fill:#061027;font-variant-numeric:tabular-nums;}
  #mimic .vtxt.warn{fill:#B45309;}
  #mimic .vtxt.crit{fill:#C0392B;}
  #mimic .vunit{font-size:8.5px;fill:#5C6773;font-weight:400;}
  #mimic .connbox{fill:#fff;stroke:#B8C0C9;stroke-width:0.8;}
  #mimic .conntxt{font-size:9px;fill:#046AFB;font-weight:700;}
  #mimic .connlbl{font-size:8px;fill:#5C6773;}
  #mimic .kpanel{fill:#F4F6F8;stroke:#B8C0C9;stroke-width:1;}
  #mimic .ktitle{font-size:10px;font-weight:700;fill:#5C6773;letter-spacing:.5px;}
  #mimic .krow{font-size:10.5px;fill:#061027;}
  #mimic .kval{font-size:11px;font-weight:700;fill:#061027;font-variant-numeric:tabular-nums;}
  #mimic .kval.warn{fill:#B45309;} #mimic .kval.crit{fill:#C0392B;}
  #mimic .gsum{font-size:10px;font-weight:700;}
  @keyframes mblink{50%{opacity:.35;}}
  #mimic g.out .sym,#mimic g.out .vbox{stroke:#C0392B;animation:mblink 1s step-end infinite;}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <span class="brand">J.S</span>
    <span class="logo">Process Intelligence</span>
    <span class="site-sub">工程檢視 · Flowsheet</span>
    <div class="hdr-actions">
      <a class="hbtn" id="btn-edit" href="/static/flowsheet_builder.html">✎ 編輯設計</a>
      <button class="hbtn" id="btn-custom">⚙ 自訂顯示</button>
      <a class="hbtn" id="btn-3d" href="/twin">3D 智慧運轉</a>
      <a class="hbtn" href="/">← 回首頁</a>
    </div>
  </header>
  <h1 id="title">Flowsheet 數據孿生（載入規格中…）</h1>
  <div class="sub" id="sub">泛用 flowsheet 渲染器：讀宣告式規格檔畫圖、每拍呼叫一次全廠求解器、顯示守門員（訓練域）狀態。</div>

  <div class="bar">
    <span class="lbl">運轉情境</span>
    <button data-s="normal" class="active">正常運轉</button>
    <button data-s="lhv_drop">進料熱值下降</button>
    <button data-s="bag_clog">濾袋阻塞</button>
    <button data-s="fan_degrade">風機軸承劣化</button>
    <span class="viewseg">
      <button id="v-cards" class="on">卡片</button>
      <button id="v-mimic">組態</button>
    </span>
    <span class="hz" id="hz" style="margin-left:auto"></span>
  </div>

  <div class="ctrls" id="ctrls"></div>

  <div id="view-cards">
  <div class="group-title">全廠即時指標</div>
  <div class="kpis" id="kpis"></div>

  <div class="group-title">製程流程（模型輸出沿連接傳遞）</div>
  <div id="trains"></div>
  <div class="legend">
    <i><span class="dot" style="background:var(--green)"></span>守門員：訓練域內</i>
    <i><span class="dot" style="background:var(--amber)"></span>外插（接近邊緣）</i>
    <i><span class="dot" style="background:var(--red)"></span>出定義域</i>
    <i><span class="dot" style="background:#C9CFD6"></span>無統計</i>
  </div>
  </div>

  <div id="mimic" style="display:none"></div>

  <details class="logbox">
    <summary>求解器呼叫紀錄（即時）</summary>
    <div id="log"></div>
  </details>
</div>

<aside id="drawer">
  <button class="dclose" id="drawer-close">×</button>
  <h2>自訂顯示</h2>
  <div class="dsub">名稱、圖示、單位、警戒值、顯示與否全部可改；即改即生效，保存在本機瀏覽器。</div>
  <div class="dglobal" id="d-global"></div>
  <div id="d-blocks"></div>
  <button class="dreset" id="d-reset">還原預設（清除本機自訂）</button>
  <div class="dhint">自訂只影響這台電腦的顯示，不會改動後端規格檔與模型。</div>
</aside>

<script src="/static/js/tour.js"></script>
<script>
// ============================================================================
// 泛用 flowsheet 渲染頁 — 完全由後端規格檔驅動，頁內不寫死任何 block 清單。
//   規格：GET  /agatha/flowsheet/{FID}/spec/  → name/desc/trains/blocks/connections/order
//   求解：POST /agatha/flowsheet/{FID}/run/   → 每拍一次，回全部 block 的預測＋守門員
//   自訂：localStorage fsCustom:{FID} → 蓋在規格檔上（僅顯示層，不動後端）
// 換 ?id=xxx 即渲染另一座廠。
// ============================================================================
const FID = new URLSearchParams(location.search).get('id') ?? 'incinerator-8b';

let SPEC=null;                 // 規格檔本體
let BLK={};                    // id → spec block
let CONNMAP=new Map();         // "from>to" → connection
let FEDBY=new Map();           // blockId → Set(target_input)
let GLAST={};                  // blockId → 上一拍守門員狀態
let scenario='normal', tickN=0, timer=null, running=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>Math.abs(v)>=100?v.toFixed(0):v.toFixed(1);
const prettyFeat=f=>String(f||'').replace(/_(mg_Nm3|ug_Nm3|g_Nm3|kNm3_h|t_h|kJ_kg|L_h|kg_h|m3_h|mm_s|m_h|MW|kPa|bar|pct|mbar|C|A)$/,'').replace(/_/g,' ');
function logln(s){const l=$('log'); l.textContent=(`${new Date().toLocaleTimeString('zh-TW',{hour12:false})}  ${s}\n`)+l.textContent; if(l.textContent.length>6000)l.textContent=l.textContent.slice(0,6000);}

// ---------------- 圖示庫（線條 SVG，取代 emoji；可在自訂抽屜換） ----------------
const ICONS={
  flame:   {n:'火焰（燃燒）', p:'<path d="M12 3c2.2 3 5 5.4 5 9a5 5 0 0 1-10 0c0-1.6.6-3 1.7-4.3C9.6 9 12 6.5 12 3z"/><path d="M12 17a2.4 2.4 0 0 0 2.4-2.4c0-1.4-1.1-2.3-2.4-3.6-1.3 1.3-2.4 2.2-2.4 3.6A2.4 2.4 0 0 0 12 17z"/>'},
  spray:   {n:'噴注（藥劑）', p:'<path d="M7 9c0-2 1.6-3.5 3.5-3.5S14 7 14 9c0 2.4-3.5 5.5-3.5 5.5S7 11.4 7 9z"/><path d="M16 13.5c0-1.1.9-2 2-2s2 .9 2 2c0 1.4-2 3.2-2 3.2s-2-1.8-2-3.2z"/><path d="M4 19h16"/>'},
  boiler:  {n:'鍋爐（蒸汽）', p:'<rect x="6" y="8" width="12" height="12" rx="2"/><path d="M9 4c0 1-1 1.2-1 2.2M13 4c0 1-1 1.2-1 2.2M17 4c0 1-1 1.2-1 2.2"/><path d="M9 14h6"/>'},
  scrubber:{n:'洗滌塔', p:'<path d="M8 3h8l-2 8a4 4 0 0 1 2 3.5c0 2.5-2 4.5-4 4.5s-4-2-4-4.5A4 4 0 0 1 10 11L8 3z"/><path d="M9.5 7h5"/>'},
  carbon:  {n:'吸附（六角）', p:'<path d="M12 3l7 4v8l-7 4-7-4V7z"/><circle cx="12" cy="11" r="2.4"/>'},
  bag:     {n:'袋濾（過濾）', p:'<path d="M4 4h16l-6 8v6l-4 2v-8z"/>'},
  fan:     {n:'風機', p:'<circle cx="12" cy="12" r="2"/><path d="M12 10c0-3 -1-5 2.5-5.5S18 8 14 10.5M14 13c2.6 1.5 4.6 2 3 5s-5 .3-5-2.7M10 13.5C7.4 15 5.4 15.4 4.5 12s2.7-4 5.5-1.7"/>'},
  turbine: {n:'發電（閃電）', p:'<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>'},
  gauge:   {n:'儀錶（監測）', p:'<path d="M4 14a8 8 0 0 1 16 0"/><path d="M12 14l3.5-3.5"/><path d="M2.5 14h3M18.5 14h3M12 6v-2.5" />'},
  box:     {n:'方塊（通用）', p:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>'},
};
function iconSvg(key){const ic=ICONS[key]||ICONS.box;return `<svg viewBox="0 0 24 24">${ic.p}</svg>`;}
// 圖示優先序：規格檔 ico（設計器選的，全使用者一致）→ 名稱推測（客戶可在抽屜改）
function iconFor(sb){
  if(sb.ico&&ICONS[sb.ico])return sb.ico;
  const n=(sb.name||'')+(sb.output_label||'');
  if(/爐|燃燒/.test(n))return 'flame';
  if(/脫硝|SNCR|噴/.test(n))return 'spray';
  if(/鍋爐|蒸汽/.test(n))return 'boiler';
  if(/洗煙|洗滌|酸/.test(n))return 'scrubber';
  if(/碳|吸附/.test(n))return 'carbon';
  if(/袋|集塵|濾/.test(n))return 'bag';
  if(/風機|引風/.test(n))return 'fan';
  if(/發電|汽輪|電/.test(n))return 'turbine';
  return sb.kind==='anomaly'?'gauge':'box';
}

const SLIDERS=[

 {key:'lime',  label:'消石灰漿 (kg/h) → 酸氣 HCl',min:80,max:320,step:5,val:180,dec:0, feats:['lime_slurry_kg_h']},
 {key:'carbon',label:'活性碳 (kg/h) → 重金屬 Hg', min:4,max:28,step:1,val:12,dec:0, feats:['carbon_inject_kg_h']},

async function optimizeUrea(){
  const knob='urea_inject_L_h';
  const blk=((SPEC&&SPEC.blocks)||[]).find(b=>b.defaults&&Object.prototype.hasOwnProperty.call(b.defaults,knob));
  if(!blk){logln('⚙ 此規格檔沒有宣告尿素噴注特徵的 block，略過');return;}
  logln(`⚙ 呼叫 ${blk.id} /optimize/ 求最小出口 NOx …`);

    if(!r||!r.best||r.best[knob]==null)throw new Error('回應缺 best');

// ---------------- 邊界訊號模擬器（假 DCS）：輸出以「模型特徵名」為鍵的 S ----------------
const P={feed:20,lhv:9500,cl:1,hg:1,lam:1.55,pf:.62,grate:12,pat:180,urea:120,feedw:62,drum:40,lime:180,water:4,carbon:12,pulse:20,fouling:2,bag_extra:0,fan_vib_x:0,fan_brg_x:0};
function drift(v,t,k){return v+(t-v)*k+(Math.random()-.5)*Math.abs(t||1)*0.01;}
function sim(){
  const sc=scenario;
  P.feed=drift(P.feed,20,.15); P.lhv=drift(P.lhv, sc==="lhv_drop"?7800:9500,.12);
  P.cl=drift(P.cl,1,.1); P.hg=drift(P.hg,1,.1);
  P.lam=ctrl('lam',1.55); P.urea=ctrl('urea',120); P.lime=ctrl('lime',180); P.carbon=ctrl('carbon',12);
  P.grate=drift(P.grate,12,.1); P.pat=drift(P.pat,180,.1);
  P.fouling=Math.min(18,P.fouling+0.004);
  P.bag_extra=drift(P.bag_extra, sc==="bag_clog"?13:0,.06);
  P.fan_vib_x=drift(P.fan_vib_x, sc==="fan_degrade"?5.5:0,.06);
  P.fan_brg_x=drift(P.fan_brg_x, sc==="fan_degrade"?20:0,.06);
  const feed=P.feed,lhv=P.lhv,lam=P.lam,pf=P.pf;
  const heat=feed*lhv/3600, stoich=feed*1000*4.6/1000, total=lam*stoich;
  const primary=total*pf, secondary=total*(1-pf), o2=21*(1-1/lam);
  const furnace=1000-300*(lam-1.30)+5.5*(heat-52)+0.25*(P.pat-180);
  const flue=total*1.15, fexit=furnace-42;
  const raw_nox=Math.max(150,300+0.5*(furnace-950)+16*(o2-6));
  const raw_hcl=Math.max(20,850*P.cl), raw_hg=Math.max(3,40*P.hg);
  const raw_dust=Math.max(1,4+0.5*(feed-20));
  const steam=Math.max(30,heat*1.25*0.98+0.3*(P.feedw-62));
  const steam_temp=400-0.6*P.fouling;
  const scrub_exit=150-3*P.water;
  const inlet_dust=raw_dust+P.lime/1000+P.carbon/2000;
  const bag_dP=8+0.7*inlet_dust+0.12*P.pulse+9*Math.min(1,tickN/400)+P.bag_extra;
  const collect=99.92-0.0006*bag_dP, out_dust=inlet_dust*1000*(1-collect/100);
  const fan_curr=80+0.4*(flue-120)+0.9*bag_dP;
  const fan_vib=2.2+1.6*Math.min(1,tickN/400)+P.fan_vib_x;
  const fan_brg=60+0.25*(fan_curr-100)+6*Math.min(1,tickN/400)+P.fan_brg_x;
  const cond_vac=-92;
  return {waste_feed_t_h:feed,waste_LHV_kJ_kg:lhv,primary_air_kNm3_h:primary,secondary_air_kNm3_h:secondary,
    grate_speed_m_h:P.grate,primary_air_temp_C:P.pat,urea_inject_L_h:P.urea,furnace_temp_C:furnace,
    inlet_NOx_mg_Nm3:raw_nox,flue_gas_flow_kNm3_h:flue,heat_release_MW:heat,feedwater_t_h:P.feedw,
    drum_pressure_bar:P.drum,boiler_inlet_gas_C:fexit,lime_slurry_kg_h:P.lime,water_inject_m3_h:P.water,
    inlet_HCl_mg_Nm3:raw_hcl,scrubber_exit_temp_C:scrub_exit,carbon_inject_kg_h:P.carbon,inlet_Hg_ug_Nm3:raw_hg,
    bag_dP_mbar:bag_dP,collection_eff_pct:collect,outlet_dust_mg_Nm3:out_dust,inlet_dust_g_Nm3:inlet_dust,
    fan_motor_current_A:fan_curr,fan_vibration_mm_s:fan_vib,fan_bearing_temp_C:fan_brg,
    inlet_steam_t_h:steam,inlet_steam_temp_C:steam_temp,condenser_vac_kPa:cond_vac};
}

function buildTrains(){
  const wrap=$('trains'); wrap.innerHTML='';
  const rendered=new Set();
  const trains=(Array.isArray(SPEC.trains)&&SPEC.trains.length)?SPEC.trains:[SPEC.order];
  trains.forEach((train,ti)=>{
    const vis=(train||[]).filter(id=>BLK[id]&&!eff(BLK[id]).hidden);
    if(!vis.length)return;
    if(ti>0)wrap.insertAdjacentHTML('beforeend','<div class="trainlbl">↳ 支線</div>');
    const row=document.createElement('div'); row.className='flow'+(ti>0?' branch':'');
    vis.forEach((id,i)=>{
      const sb=BLK[id];
      if(i>0)row.insertAdjacentHTML('beforeend',arrowHtml(vis[i-1],id));
      if(rendered.has(id)){row.insertAdjacentHTML('beforeend',refCard(sb));}
      else{row.insertAdjacentHTML('beforeend',card(sb)); rendered.add(id);}
    });
    wrap.appendChild(row);
  });
  const left=(SPEC.blocks||[]).filter(b=>!rendered.has(b.id)&&!eff(b).hidden);
  if(left.length){
    wrap.insertAdjacentHTML('beforeend','<div class="trainlbl">未排入 train 的 block</div>');
    const row=document.createElement('div'); row.className='flow branch';
    left.forEach(b=>{row.insertAdjacentHTML('beforeend',card(b)); rendered.add(b.id);});
    wrap.appendChild(row);
  }
}

// ---------------- 每拍：組 per-block inputs → POST run 一次 → 渲染 ----------------
let LASTRESP=null;
async function tick(){
  if(!SPEC||running)return;
  running=true; tickN++;
  try{
    const S=sim();
    const inputs={};
    for(const sb of (SPEC.blocks||[])){
      const fed=FEDBY.get(sb.id), bi={};
      for(const [f,dv] of Object.entries(sb.defaults||{})){
        if(fed&&fed.has(f))continue;
        const v=(S[f]!=null&&isFinite(S[f]))?S[f]:dv;
        bi[f]=+(+v).toFixed(3);
      }
      inputs[sb.id]=bi;
    }
    let resp;
    try{
      const r=await fetch(`/agatha/flowsheet/${encodeURIComponent(FID)}/run/`,{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({inputs,source:'flowsheet-ui'}),
        signal:AbortSignal.timeout(5000)});
      if(!r.ok)throw new Error('HTTP '+r.status);
      resp=await r.json();
    }catch(e){
      $('hz').textContent=`● run 失敗（第 ${tickN} 拍）`;
      if(tickN===1||tickN%15===0)logln('✖ POST run 失敗：'+(e.message||e));
      return;
    }
    LASTRESP=resp;
    renderRun(resp);
  }finally{running=false;}
}

function renderRun(resp,silent){
  const rb=(resp&&resp.blocks)||{};
  const counts={ok:0,warn:0,out:0,unknown:0,err:0};
  for(const sb of (SPEC.blocks||[])){ if(!eff(sb).hidden) renderBlock(sb,rb[sb.id],counts,silent); }
  for(const c of ((resp&&resp.connections)||[])){
    const vtxt=(c.value!=null&&isFinite(c.value))?fmt(c.value):'--';
    const el=$('connlbl_'+c.from+'__'+c.to);
    if(el)el.innerHTML=`${esc(prettyFeat(c.source_output))} → <b>${vtxt}</b> ${esc(c.unit||'')}`;
    if(!silent)logln(`↦ ${c.from}→${c.to} ${c.source_output}=${vtxt} ${c.unit||''}`);
  }
  renderKpis(rb);
  updateMimic(resp);
  if(!silent){
    const gsum=`guard: ${counts.ok} ok`+(counts.warn?` / ${counts.warn} warn`:'')+(counts.out?` / ${counts.out} out`:'')+(counts.unknown?` / ${counts.unknown} unknown`:'');
    logln(`run ${resp&&resp.ms!=null?resp.ms:'--'}ms · ${(SPEC.blocks||[]).length} blocks · ${gsum}`+(counts.err?` · ${counts.err} err/skip`:''));
    $('hz').textContent=`● 每 2s · POST run ×1 · 第 ${tickN} 拍${resp&&resp.ms!=null?` · ${resp.ms}ms`:''}`;
  }
}

const GTXT={warn:'⚠ 外插',out:'✖ 出定義域'};
const GDOT={ok:'var(--green)',warn:'var(--amber)',out:'var(--red)',unknown:'#C9CFD6'};
function renderBlock(sb,rbk,counts,silent){
  const e=eff(sb);
  const id=sb.id, V=$('val_'+id),ST=$('st_'+id),K=$('key_'+id),EL=$('blk_'+id);
  if(!EL||!V||!ST||!K)return;
  EL.classList.remove('err','gd-warn','gd-out');
  if(!rbk||rbk.error||rbk.skipped){
    counts.err++;
    EL.classList.add('err');
    const why=!rbk?'無回應':(rbk.skipped?('略過：'+rbk.skipped):('錯誤：'+rbk.error));
    V.innerHTML=`--<span class="unit"> ${esc(sb.kind==='anomaly'?'/100':(e.unit||''))}</span>`;
    ST.textContent=why.length>16?why.slice(0,16)+'…':why;
    ST.className='st na';
    K.style.background='#C9CFD6';
    if(!silent&&GLAST[id]!=='err')logln(`✖ ${id} ${why}`);
    GLAST[id]='err';
    return;
  }
  const p=rbk.prediction||{};
  let cls='ok',label='正常';
  if(sb.kind==='anomaly'){
    const h=p.health, over=!!p.over_threshold;
    cls=over?'crit':h>=70?'ok':h>=50?'warn':'crit';
    label=over?'⚠ 超標告警':h>=70?'健康':h>=50?'注意':'劣化';
    V.innerHTML=`${h!=null?Math.round(h):'--'}<span class="unit"> /100</span>`;
  }else{
    const v=p.value;
    if(v!=null&&e.warn!=null&&e.crit!=null&&!Number.isNaN(e.warn)&&!Number.isNaN(e.crit)){
      if(e.better==='low'){cls=v>=e.crit?'crit':v>=e.warn?'warn':'ok';label=v>=e.crit?'偏高':v>=e.warn?'注意':'正常';}
      else{cls=v<=e.crit?'crit':v<=e.warn?'warn':'ok';label=v<=e.crit?'偏低':v<=e.warn?'注意':'正常';}
    }
    V.innerHTML=`${v!=null?fmt(v):'--'}<span class="unit"> ${esc(e.unit||'')}</span>`;
  }
  const gs=(rbk.guard&&rbk.guard.status)||'unknown';
  if(counts[gs]!=null)counts[gs]++;else counts.unknown++;
  if(gs==='warn'||gs==='out'){
    ST.textContent=GTXT[gs]; ST.className='st '+(gs==='out'?'crit':'warn');
    EL.classList.add(gs==='out'?'gd-out':'gd-warn');
  }else{
    ST.textContent=label; ST.className='st '+cls;
  }
  K.style.background=GDOT[gs]||GDOT.unknown;
  if(!silent&&gs!==GLAST[id]){
    if(gs==='warn'||gs==='out'){
      const checks=(rbk.guard&&rbk.guard.checks)||[];
      for(const c of checks)logln(`⚠ ${id} ${c.feature}=${c.value!=null?fmt(+c.value):'--'} 超出訓練域 [${c.lo}, ${c.hi}]（${c.band||''}）`);
      if(!checks.length)logln(`⚠ ${id} guard=${gs}`);
    }else if(GLAST[id]==='warn'||GLAST[id]==='out'){
      logln(`✓ ${id} 回到訓練域內`);
    }
  }
  GLAST[id]=gs;
}

function renderKpis(rb){
  const items=[];
  for(const id of (SPEC.order||[])){
    const sb=BLK[id]; if(!sb||sb.kind==='anomaly')continue;
    const e=eff(sb); if(e.hidden)continue;
    const en=rb[id], v=en&&en.prediction&&en.prediction.value;
    items.push([sb.output_label||e.name||id, (v!=null&&isFinite(v))?fmt(v):'--', e.unit||'']);
  }
  $('kpis').innerHTML=items.map(k=>`<div class="kpi"><div class="k">${esc(k[0])}</div><div class="v">${k[1]} <span class="unit">${esc(k[2])}</span></div></div>`).join('');
}

// ============================================================================
// 組態畫面（PI Vision 式運轉圖）：由同一份規格檔自動生成——灰底畫布、ISA 式圖符、
// 數值框、連接傳遞標籤、右側 KPI 面板；與卡片檢視共用同一個 /run/ 迴圈。
// 客戶用設計器組的任何 flowsheet，存檔後自動就有組態畫面（不是手繪的板）。
// ============================================================================
const SYMBOLS={
  flame:'<rect class="sym" x="24" y="14" width="16" height="12"/><rect class="sym" x="10" y="26" width="44" height="46" rx="3"/><path class="sym" style="fill:none" d="M32 64c-7-4-9-9-5-15 2 4 4 5 6 4-2-6 0-11 6-15-2 7 6 9 4 16-1 6-6 10-11 10z"/>',
  spray:'<path class="pipe" d="M32 20V8"/><rect class="sym" x="16" y="20" width="32" height="52" rx="10"/><path class="sym" style="fill:none" d="M26 38l-4-9M32 40V29M38 38l4-9"/>',
  boiler:'<ellipse class="sym" cx="32" cy="24" rx="22" ry="10"/><path class="sym" style="fill:none" d="M18 34v28M32 34v28M46 34v28"/><rect class="sym" x="12" y="62" width="40" height="9"/>',
  scrubber:'<rect class="sym" x="20" y="12" width="24" height="60" rx="9"/><path class="sym" style="fill:none" d="M22 32h20M22 44h20M22 56h20"/>',
  carbon:'<rect class="sym" x="18" y="18" width="28" height="54" rx="9"/><circle class="sym" cx="28" cy="34" r="2.2"/><circle class="sym" cx="37" cy="42" r="2.2"/><circle class="sym" cx="28" cy="52" r="2.2"/><circle class="sym" cx="36" cy="60" r="2.2"/><circle class="sym" cx="32" cy="26" r="2.2"/>',
  bag:'<rect class="sym" x="14" y="22" width="36" height="38"/><path class="sym" style="fill:none" d="M23 26v30M32 26v30M41 26v30"/><path class="sym" style="fill:none" d="M14 60l18 12 18-12"/>',
  fan:'<circle class="sym" cx="32" cy="44" r="20"/><path class="sym" style="fill:none" d="M32 44c2-8 8-10 14-8M32 44c-8 2-10 8-8 14M32 44c6 6 4 12-2 14M32 44c-6-6-4-12 2-14"/><circle class="sym" cx="32" cy="44" r="3"/>',
  turbine:'<path class="sym" d="M14 30l36-10v46L14 58z"/><path class="pipe" d="M4 44h10M50 42h10"/>',
  gauge:'<circle class="sym" cx="32" cy="46" r="20"/><path class="sym" style="fill:none" d="M32 46L20 34"/><path class="sym" style="fill:none" d="M32 28v-5M46 33l4-4M18 33l-4-4"/>',
  box:'<rect class="sym" x="12" y="20" width="40" height="52" rx="4"/>',
};
const M={SP:150,X0:30,ROW:175,Y0:34};
let MIMIC_BUILT=false;

function buildMimic(){
  if(!SPEC)return;
  const trains=(Array.isArray(SPEC.trains)&&SPEC.trains.length)?SPEC.trains:[SPEC.order];
  const visTrains=trains.map(t=>(t||[]).filter(id=>BLK[id]&&!eff(BLK[id]).hidden)).filter(t=>t.length);
  const regs=(SPEC.order||[]).filter(id=>BLK[id]&&BLK[id].kind!=='anomaly'&&!eff(BLK[id]).hidden);
  const maxCols=Math.max(1,...visTrains.map(t=>t.length));
  const kpx=M.X0+maxCols*M.SP+30;
  const kph=64+regs.length*22+40;
  const svgW=kpx+236, svgH=Math.max(M.Y0+visTrains.length*M.ROW+20, kph+40);
  const rendered=new Set();
  let out=`<rect x="0" y="0" width="${svgW}" height="${svgH}" fill="#E7EAEE"/>`;
  visTrains.forEach((train,ti)=>{
    const rowY=M.Y0+ti*M.ROW;
    if(ti>0)out+=`<text class="mnm" x="${M.X0-14}" y="${rowY+2}">↳ 支線</text>`;
    train.forEach((id,i)=>{
      const sb=BLK[id], e=eff(sb), x=M.X0+i*M.SP;
      // 管線（前一塊 → 這一塊），有 connection 就掛傳遞值標籤
      if(i>0){
        const px=M.X0+(i-1)*M.SP+66, py=rowY+56, ex=x-4;
        out+=`<path class="pipe" d="M${px} ${py}H${ex}"/><path class="pipe" d="M${ex-6} ${py-4}l7 4-7 4" style="fill:none"/>`;
        const c=CONNMAP.get(train[i-1]+'>'+id);
        if(c){const mx=(px+ex)/2;
          out+=`<rect class="connbox" x="${mx-46}" y="${py-36}" width="92" height="27" rx="3"/>
          <text class="connlbl" x="${mx}" y="${py-26}" text-anchor="middle">${esc(prettyFeat(c.source_output))}</text>
          <text class="conntxt" id="mconn_${esc(c.from)}__${esc(c.to)}" x="${mx}" y="${py-14}" text-anchor="middle">--</text>`;}
      }
      const ref=rendered.has(id);
      out+=`<g id="gm_${esc(id)}" transform="translate(${x},${rowY})">
        <text class="mtag" x="32" y="6" text-anchor="middle">${esc(id)}</text>`;
      if(ref){
        out+=`<rect class="sym" x="12" y="20" width="40" height="52" rx="4" stroke-dasharray="4 3" style="fill:none"/>
          <text class="mnm" x="32" y="50" text-anchor="middle">同主線</text></g>`;
        return;
      }
      rendered.add(id);
      out+=SYMBOLS[e.icon]||SYMBOLS.box;
      out+=`<rect class="vbox" id="mbox_${esc(id)}" x="-22" y="90" width="108" height="30" rx="3"/>
        <text class="vtxt" id="mval_${esc(id)}" x="32" y="110" text-anchor="middle">--</text>
        <text class="mnm" x="32" y="134" text-anchor="middle">${esc((e.name||id).slice(0,10))}</text></g>`;
    });
  });
  // 右側 KPI 面板（像 DCS 總覽的資訊塊）
  out+=`<rect class="kpanel" x="${kpx}" y="20" width="216" height="${kph}" rx="4"/>
    <text class="ktitle" x="${kpx+14}" y="42">全廠即時指標</text>
    <line x1="${kpx+12}" y1="50" x2="${kpx+204}" y2="50" stroke="#C6CDD5" stroke-width="1"/>`;
  regs.forEach((id,i)=>{
    const e=eff(BLK[id]), y=68+i*22;
    out+=`<text class="krow" x="${kpx+14}" y="${y}">${esc((BLK[id].output_label||e.name||id).slice(0,12))}</text>
      <text class="kval" id="mk_${esc(id)}" x="${kpx+202}" y="${y}" text-anchor="end">--</text>`;
  });
  out+=`<line x1="${kpx+12}" y1="${68+regs.length*22}" x2="${kpx+204}" y2="${68+regs.length*22}" stroke="#C6CDD5" stroke-width="1"/>
    <text class="gsum" id="m_guard" x="${kpx+14}" y="${68+regs.length*22+22}" fill="#059669">守門員 —</text>`;
  $('mimic').innerHTML=`<svg viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
  MIMIC_BUILT=true;
}

function updateMimic(resp){
  if(!MIMIC_BUILT)return;
  const rb=(resp&&resp.blocks)||{};
  const counts={ok:0,warn:0,out:0,unknown:0};
  for(const sb of (SPEC.blocks||[])){
    const e=eff(sb); if(e.hidden)continue;
    const rbk=rb[sb.id], g=document.getElementById('gm_'+sb.id);
    const V=document.getElementById('mval_'+sb.id), B=document.getElementById('mbox_'+sb.id);
    if(!V||!B)continue;
    if(!rbk||rbk.error||rbk.skipped){
      V.innerHTML='--'; B.setAttribute('class','vbox'); V.setAttribute('class','vtxt');
      g&&g.classList.remove('out'); continue;
    }
    const p=rbk.prediction||{};
    let cls='ok';
    if(sb.kind==='anomaly'){
      const h=p.health;
      cls=p.over_threshold?'crit':h>=70?'ok':h>=50?'warn':'crit';
      V.innerHTML=`${h!=null?Math.round(h):'--'}<tspan class="vunit"> /100</tspan>`;
    }else{
      const v=p.value;
      if(v!=null&&e.warn!=null&&e.crit!=null&&!Number.isNaN(e.warn)&&!Number.isNaN(e.crit)){
        if(e.better==='low')cls=v>=e.crit?'crit':v>=e.warn?'warn':'ok';
        else cls=v<=e.crit?'crit':v<=e.warn?'warn':'ok';
      }
      V.innerHTML=`${v!=null?fmt(v):'--'}<tspan class="vunit"> ${esc(e.unit||'')}</tspan>`;
      const K=document.getElementById('mk_'+sb.id);
      if(K){K.textContent=v!=null?fmt(v):'--';K.setAttribute('class','kval'+(cls!=='ok'?' '+cls:''));}
    }
    const gs=(rbk.guard&&rbk.guard.status)||'unknown';
    if(counts[gs]!=null)counts[gs]++;
    B.setAttribute('class','vbox'+(cls!=='ok'?' '+cls:''));
    V.setAttribute('class','vtxt'+(cls!=='ok'?' '+cls:''));
    if(g)g.classList.toggle('out',gs==='out');
  }
  for(const c of ((resp&&resp.connections)||[])){
    const el=document.getElementById('mconn_'+c.from+'__'+c.to);
    if(el)el.textContent=(c.value!=null&&isFinite(c.value))?`${fmt(c.value)} ${c.unit||''}`:'--';
  }
  const G=document.getElementById('m_guard');
  if(G){
    if(counts.out){G.textContent=`✖ ${counts.out} 台出定義域`;G.setAttribute('fill','#C0392B');}
    else if(counts.warn){G.textContent=`⚠ ${counts.warn} 台外插`;G.setAttribute('fill','#B45309');}
    else{G.textContent=`守門員 ${counts.ok} ok`;G.setAttribute('fill','#059669');}
  }
}

// 檢視切換（記住偏好）
function applyView(v){
  const mode=v||localStorage.getItem('fsView:'+FID)||'cards';
  $('view-cards').style.display=mode==='mimic'?'none':'';
  $('mimic').style.display=mode==='mimic'?'':'none';
  $('v-cards').classList.toggle('on',mode!=='mimic');
  $('v-mimic').classList.toggle('on',mode==='mimic');
  localStorage.setItem('fsView:'+FID,mode);
}
$('v-cards').addEventListener('click',()=>applyView('cards'));
$('v-mimic').addEventListener('click',()=>applyView('mimic'));

boot().catch(e=>{specError(e);});
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EJ_3D Ai｜全廠 3D 數位孿生平台 — 領航示範 MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">EJ_3D&nbsp;Ai</span>
      <span class="brand-title">全廠 3D 數位孿生平台</span>
      <span class="brand-sub">領航示範 MVP｜穎杰科技</span>
    </div>
    <div class="topbar-right">
      <div class="chip" id="gd-chip" title="廠區酸霧偵測 GD-001">
        GD-001 <b id="gd-value">--</b> <span class="unit">ppm</span>
      </div>
      <div class="chip" id="ws-status">連線中…</div>
      <a class="chip chip-btn" href="/api/export/usd" download title="匯出 OpenUSD，可直接以 NVIDIA Omniverse 開啟">
        匯出 USD ↓
      </a>
    </div>
  </header>

  <div id="alarm-banner" class="hidden">
    <div class="alarm-title" id="alarm-message"></div>
    <div class="alarm-list" id="alarm-list"></div>
  </div>

  <aside id="left-panel">
    <div class="panel-title">廠區設備樹</div>
    <div id="plant-tree"></div>
    <div class="panel-hint">點設備（或場景中的標籤）查看資訊卡</div>
  </aside>

  <aside id="info-card" class="hidden">
    <button id="info-close" title="關閉">×</button>
    <div class="info-tag" id="info-tag">—</div>
    <div class="info-name" id="info-name"></div>
    <div class="info-meta" id="info-meta"></div>
    <div class="info-section">設計資料</div>
    <table class="info-table" id="info-design"></table>
    <div class="info-section">即時儀錶（模擬 DCS 數據）</div>
    <table class="info-table" id="info-instruments"></table>
  </aside>

  <footer id="scenario-bar">
    <span class="bar-label">工安情境模擬</span>
    <div id="scenario-buttons"></div>
    <span class="bar-hint" id="scenario-desc">預載情境比對法：實際洩漏時依 DCS 感測值比對最接近情境</span>
  </footer>

  <main id="viewport"></main>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>

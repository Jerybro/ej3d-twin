<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入｜Process Intelligence</title>
  <style>
    :root {
      --blue: #046AFB; --bg: #F6F7FA; --white: #fff; --bdr: #DBDDE0;
      --text: #061027; --text2: #5C6773;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif; background: var(--bg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--white); border: 1px solid var(--bdr); border-radius: 10px;
      padding: 48px 52px; width: 400px; text-align: center;
      box-shadow: 0 10px 40px rgba(6, 16, 39, 0.06);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .brand svg { width: 30px; height: 30px; }
    .brand b { font-size: 20px; color: var(--text); letter-spacing: 0.4px; }
    .sub { font-size: 13.5px; color: var(--text2); margin-bottom: 34px; }
    .gbtn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px; border: 1px solid var(--bdr); border-radius: 6px;
      background: var(--white); font-size: 15px; color: var(--text); cursor: pointer;
      font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .gbtn:hover { border-color: var(--blue); box-shadow: 0 2px 10px rgba(4, 106, 251, 0.12); }
    .gbtn svg { width: 18px; height: 18px; }
    .note { font-size: 12.5px; color: var(--text2); margin-top: 22px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#046AFB" stroke-width="2" stroke-linecap="round">
        <path d="M2 12h4l2-7 4 14 3-10 2 3h5" />
      </svg>
      <b>Process Intelligence</b>
    </div>
    <div class="sub">製程資料智能平台——請先登入</div>
    <button class="gbtn" id="g">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 40.4 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      使用 Google 帳號登入
    </button>
    <p class="note">第一個登入的帳號將成為管理員。<br>登入即代表同意平台記錄你的 email 與名稱作為資料歸屬識別。</p>
  </div>
  <script>
    document.getElementById('g').addEventListener('click', () => {
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.href = `/login/google?next=${encodeURIComponent(next)}`;
    });
  </script>
</body>
</html>

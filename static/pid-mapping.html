<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>點位對照｜Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F7FA; --panel: #ffffff; --panel2: #F1F3F6;
      --bdr: #DBDDE0; --accent: #046AFB; --accent-deep: #E3EDFE;
      --text: #061027; --dim: #5C6773;
      --hi: #12A150; --mid: #E0A415; --lo: #D93F3F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 13px; }
    button, input, select { font: inherit; }
    .hint { font-size: 11.5px; color: var(--dim); line-height: 1.6; }
    .mini-btn { padding: 5px 10px; border-radius: 6px; font-size: 11.5px; cursor: pointer;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); }
    .mini-btn:hover { border-color: var(--accent); }
    .mini-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .mini-btn:disabled { opacity: .4; pointer-events: none; }
    .seg { display: inline-flex; border: 1px solid var(--bdr); border-radius: 7px; overflow: hidden; }
    .seg button { padding: 5px 11px; border: 0; border-left: 1px solid var(--bdr); background: transparent; color: var(--dim); font-size: 12px; cursor: pointer; }
    .seg button:first-child { border-left: 0; }
    .seg button.on { background: var(--accent-deep); color: var(--accent); font-weight: 600; }

    /* ------------------------------------------------ 步驟列 */
    .steps { height: 52px; background: var(--panel); border-bottom: 1px solid var(--bdr);
      display: flex; align-items: center; gap: 0; padding: 0 16px; }
    .brand-home { display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px;
      border-radius: 6px; background: rgba(4,106,251,0.08); border: 1px solid var(--bdr); color: var(--accent);
      font-size: 15px; font-weight: 700; text-decoration: none; margin-right: 12px; }
    .step { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      color: var(--dim); font-size: 12.5px; }
    .step:hover { background: var(--panel2); }
    .step.on { color: var(--text); background: var(--accent-deep); }
    .step .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .step.done .n { background: var(--hi); border-color: var(--hi); color: #fff; }
    .step.on .n { background: var(--accent); border-color: var(--accent); color: #fff; }
    .step b { font-weight: 600; }
    .step span.v { color: var(--dim); font-weight: 400; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .arrow { color: #C3CAD2; padding: 0 4px; }
    .steps .sp { flex: 1; }

    /* ------------------------------------------------ 主區 */
    .main { display: flex; height: calc(100vh - 52px); }
    /* 左：圖 */
    .canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .cbar { height: 42px; flex-shrink: 0; border-bottom: 1px solid var(--bdr); background: var(--panel);
      display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 12px; }
    .cbar .sp { flex: 1; }
    .lg { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
    .lg i { width: 12px; height: 10px; border-radius: 2px; display: inline-block; border: 1.5px solid; }
    #stage { flex: 1; overflow: auto; background: #E9EDF2; position: relative; }
    #stage.empty { display: grid; place-items: center; color: var(--dim); }
    #wrap { position: relative; display: inline-block; }
    #img { display: block; user-select: none; -webkit-user-drag: none; }
    #ov { position: absolute; inset: 0; }
    /* 設備方塊：顏色＝數據狀態 */
    .eqb { position: absolute; border: 2px solid #B8BFC8; border-radius: 3px; cursor: pointer;
      background: rgba(184,191,200,0.06); transition: box-shadow .12s; }
    .eqb.some { border-color: var(--mid); background: rgba(224,164,21,0.10); }
    .eqb.done { border-color: var(--hi); background: rgba(18,161,80,0.10); }
    .eqb.cur { box-shadow: 0 0 0 3px rgba(4,106,251,0.35); border-color: var(--accent); }
    .eqb.drop { box-shadow: 0 0 0 4px rgba(4,106,251,0.5); background: rgba(4,106,251,0.16); }
    .eqb .cnt { position: absolute; top: -9px; right: -9px; min-width: 18px; height: 18px; border-radius: 9px;
      background: var(--hi); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center;
      padding: 0 5px; border: 2px solid #fff; }
    .eqb.some .cnt { background: var(--mid); }
    .eqb .lb { position: absolute; left: -2px; bottom: 100%; margin-bottom: 2px; white-space: nowrap;
      font-size: 10px; color: var(--dim); background: rgba(255,255,255,.85); padding: 0 3px; border-radius: 2px; }
    /* 右：面板 */
    .side { width: 440px; flex-shrink: 0; border-left: 1px solid var(--bdr); background: var(--panel);
      display: flex; flex-direction: column; }
    .sbar { padding: 12px 14px; border-bottom: 1px solid var(--bdr); }
    .sbar h2 { font-size: 15px; font-weight: 700; }
    .sbar .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
    .stat-row { display: flex; gap: 6px; margin-top: 8px; }
    .stat { flex: 1; background: var(--panel2); border-radius: 7px; padding: 6px 8px; }
    .stat b { display: block; font-size: 16px; }
    .stat span { font-size: 10.5px; color: var(--dim); }
    .stat.ok b { color: var(--hi); } .stat.warn b { color: var(--mid); } .stat.bad b { color: var(--lo); }
    .scroll { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin: 12px 0 8px; }
    .section-title:first-child { margin-top: 0; }
    /* 量測點卡 */
    .pt { border: 1px solid var(--bdr); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--panel2); }
    .pt.done { border-color: rgba(18,161,80,.5); background: rgba(18,161,80,.05); }
    .pt.guess { border-color: rgba(224,164,21,.6); }
    .pt .h { display: flex; align-items: center; gap: 8px; }
    .pt .col { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--bdr); color: var(--dim); white-space: nowrap; }
    .badge.guess { border-color: #E0A415; color: #8a5b00; background: rgba(224,164,21,.08); }
    .badge.done { border-color: var(--hi); color: #0b6b36; background: rgba(18,161,80,.08); }
    .badge.none { border-color: var(--lo); color: var(--lo); background: rgba(217,63,63,.06); }
    .x { color: var(--dim); cursor: pointer; padding: 0 4px; font-size: 14px; }
    .x:hover { color: var(--lo); }
    .pt .stats { display: flex; gap: 10px; align-items: center; margin-top: 5px; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .pt .stats b { color: var(--text); font-weight: 600; }
    .spark { display: inline-flex; align-items: flex-end; gap: 1px; height: 16px; }
    .spark i { display: block; width: 3px; background: #9AA3AE; border-radius: 1px 1px 0 0; }
    .pt .form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 7px; }
    .pt .form label { font-size: 10.5px; color: var(--dim); display: block; }
    .pt .form input, .pt .form select { width: 100%; padding: 3px 6px; border: 1px solid var(--bdr); border-radius: 5px; background: #fff; font-size: 12px; }
    .pt .rng { display: flex; gap: 4px; align-items: center; }
    .pt .rng input { width: 100%; }
    .g { font-size: 10.5px; color: var(--dim); }
    .g.guess { color: #8a5b00; } .g.man { color: var(--accent); }
    .pt .act { display: flex; gap: 6px; margin-top: 7px; align-items: center; }
    .pt .act .g { flex: 1; }
    /* 未歸戶抽屜 */
    .pool { border: 1px dashed var(--bdr); border-radius: 8px; padding: 8px 10px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; margin: 0 5px 5px 0; border-radius: 999px;
      border: 1px solid var(--bdr); background: #fff; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; cursor: grab; }
    .chip:active { cursor: grabbing; }
    .chip .m { font-family: Inter, sans-serif; color: var(--dim); font-size: 10.5px; }
    .chip.drag { opacity: .4; }
    #series { height: 80px; width: 100%; margin-top: 6px; }
    .empty { color: var(--dim); font-size: 12.5px; padding: 30px 0; text-align: center; }
    /* 選擇面板（步驟 1/2 用） */
    .pick { padding: 12px 14px; }
    .pick .item { padding: 8px 10px; border-radius: 7px; border: 1px solid var(--bdr); background: var(--panel2); margin-bottom: 5px; cursor: pointer; font-size: 12px; }
    .pick .item:hover, .pick .item.on { border-color: var(--accent); }
    .pick .item.on { background: var(--accent-deep); }
    .pick .item b { display: block; word-break: break-all; }
    .pick .item .m { color: var(--dim); font-size: 11px; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="steps">
    <a class="brand-home" href="/" title="回首頁">⌂</a>
    <div class="step on" data-step="1"><span class="n">1</span><b>資產模型</b><span class="v" id="s1v">選一張圖</span></div>
    <span class="arrow">›</span>
    <div class="step" data-step="2"><span class="n">2</span><b>歷史數據</b><span class="v" id="s2v">選資料集</span></div>
    <span class="arrow">›</span>
    <div class="step" data-step="3"><span class="n">3</span><b>綁點位</b><span class="v" id="s3v">把欄位對到設備</span></div>
    <span class="sp"></span>
    <span class="hint">對清楚才綁定孿生</span>
  </div>

  <div class="main">
    <div class="canvas">
      <div class="cbar">
        <span class="seg" id="mode">
          <button class="on" data-m="annot">標示</button>
          <button data-m="blind">盲重建</button>
          <button data-m="trace">描圖</button>
        </span>
        <span class="seg"><button id="zo">−</button><button id="zf">全圖</button><button id="zi">＋</button></span>
        <span class="sp"></span>
        <span class="lg"><i style="border-color:var(--hi);background:rgba(18,161,80,.15)"></i>已確認點位</span>
        <span class="lg"><i style="border-color:var(--mid);background:rgba(224,164,21,.15)"></i>只有猜的</span>
        <span class="lg"><i style="border-color:#B8BFC8"></i>沒數據</span>
        <span class="hint">點方塊看它的點位；把右邊欄位拖到方塊上就是綁定</span>
      </div>
      <div id="stage" class="empty"><span>先在右邊選一張圖</span></div>
    </div>

    <div class="side">
      <div class="sbar" id="sbar"><h2>點位對照</h2><div class="sub">① 選資產模型 → ② 選歷史數據 → ③ 把欄位對到設備</div></div>
      <div class="scroll" id="panel"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
async function getJSON(url, opt) { const r = await fetch(url, opt); const t = await r.text(); let d = null; try { d = JSON.parse(t); } catch {} if (!r.ok) throw new Error((d && d.detail) || `伺服器錯誤 ${r.status}`); return d; }
const fmt = v => v == null ? '—' : (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
const MEASURES = ['流量','溫度','壓力','液位','電流','頻率','功率','電度','電壓','負載率','轉速','振動','設定值','運轉狀態','其他'];
const UNITS = ['t/h','kg/h','m³/h','L/h','°C','kPa','bar','%','A','Hz','kW','kWh','V','rpm','mm/s',''];

let step = 1, drawing = null, sid = null, model = null, map = null, mode = 'annot', zoom = 1, curTag = null;
let files = [], datasets = [], baseW = 1600, baseH = 1120;

// ------------------------------------------------------------ 步驟
document.querySelectorAll('.step').forEach(s => s.onclick = () => setStep(+s.dataset.step));
function setStep(n) {
  step = n;
  document.querySelectorAll('.step').forEach(s => {
    const k = +s.dataset.step;
    s.classList.toggle('on', k === n);
    s.classList.toggle('done', (k === 1 && !!drawing) || (k === 2 && !!sid));
  });
  renderPanel();
}

// ------------------------------------------------------------ 載入
async function init() {
  const p = new URLSearchParams(location.search);
  [files, datasets] = await Promise.all([
    getJSON('/api/pid/list').catch(() => []),
    getJSON('/api/pid/mapping/datasets').catch(() => []),
  ]);
  if (p.get('drawing')) await pickDrawing(p.get('drawing'), true);
  if (p.get('sid')) await pickDataset(p.get('sid'), true);
  setStep(sid && drawing ? 3 : drawing ? 2 : 1);
}
async function pickDrawing(name, silent) {
  drawing = name;
  $('s1v').textContent = name.replace(/\.pdf$/i, '').slice(0, 28);
  try { model = await getJSON(`/api/pid/model/${encodeURIComponent(name)}`); }
  catch (e) { model = null; alert('這張圖還沒有資產模型——先到判讀工作台建立：' + e.message); return; }
  loadImage();
  syncUrl();
  if (sid) await ensureDrawingInMapping();
  if (!silent) setStep(sid ? 3 : 2);
}
async function pickDataset(s, silent) {
  sid = s;
  const ds = datasets.find(d => d.sid === s);
  $('s2v').textContent = (ds && ds.filename) || s;
  syncUrl();
  await ensureDrawingInMapping();
  if (!silent) setStep(3);
}
async function ensureDrawingInMapping() {
  if (!sid) return;
  // 對照檔要知道對哪張圖；沒有就把目前這張加進去（可多張）
  const cur = await getJSON(`/api/pid/mapping/${encodeURIComponent(sid)}`).catch(() => null);
  const have = (cur && cur.drawings) || [];
  if (drawing && !have.includes(drawing)) {
    await getJSON(`/api/pid/mapping/${encodeURIComponent(sid)}/drawings`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ drawings: [...have, drawing] }) });
  }
  await reloadMap();
}
async function reloadMap() {
  if (!sid) { map = null; return; }
  map = await getJSON(`/api/pid/mapping/${encodeURIComponent(sid)}`);
  const s = map.summary;
  $('s3v').textContent = `已確認 ${s.confirmed}／猜的 ${s.guessed}／未歸戶 ${s.unassigned}`;
  drawBoxes(); renderPanel();
}
function syncUrl() {
  const p = new URLSearchParams(); if (drawing) p.set('drawing', drawing); if (sid) p.set('sid', sid);
  history.replaceState(null, '', '?' + p.toString());
}

// ------------------------------------------------------------ 圖
function imgUrl() {
  const f = encodeURIComponent(drawing);
  return mode === 'annot' ? `/api/pid/model/${f}/annotated.jpg?t=${Date.now()}` : `/api/pid/model/${f}/rebuild.svg?mode=${mode}&t=${Date.now()}`;
}
function loadImage() {
  const st = $('stage'); st.className = '';
  st.innerHTML = `<div id="wrap"><img id="img" src="${imgUrl()}" draggable="false"/><div id="ov"></div></div>`;
  const img = $('img');
  img.onload = () => { baseW = img.naturalWidth; baseH = img.naturalHeight; fit(); drawBoxes(); };
  bindPan();
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); if (drawing) { $('img').src = imgUrl(); } });
function applyZoom() { const img = $('img'); if (!img) return; img.style.width = Math.round(baseW * zoom) + 'px'; }
function fit() { const st = $('stage'); zoom = Math.min(1, (st.clientWidth - 24) / baseW); applyZoom(); }
$('zi').onclick = () => { zoom = Math.min(zoom * 1.4, 6); applyZoom(); };
$('zo').onclick = () => { zoom = Math.max(zoom / 1.4, 0.05); applyZoom(); };
$('zf').onclick = fit;
$('stage').addEventListener('wheel', e => { if (!$('img')) return; e.preventDefault(); const st = $('stage'); const r = st.getBoundingClientRect(); const mx = e.clientX - r.left + st.scrollLeft, my = e.clientY - r.top + st.scrollTop; const b = zoom; zoom = Math.max(0.05, Math.min(6, zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); applyZoom(); const k = zoom / b; st.scrollLeft = mx * k - (e.clientX - r.left); st.scrollTop = my * k - (e.clientY - r.top); }, { passive: false });
function bindPan() {
  const st = $('stage'), ov = $('ov');
  ov.addEventListener('pointerdown', e => {
    if (e.target !== ov || e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY, l0 = st.scrollLeft, t0 = st.scrollTop; ov.style.cursor = 'grabbing';
    const mv = ev => { st.scrollLeft = l0 - (ev.clientX - sx); st.scrollTop = t0 - (ev.clientY - sy); };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); ov.style.cursor = ''; };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}
function coverOf(tag) {
  const e = (map && map.equipment || []).find(x => x.tag === tag);
  return e ? { n: e.points, c: e.confirmed, g: e.guessed } : { n: 0, c: 0, g: 0 };
}
function drawBoxes() {
  const ov = $('ov'); if (!ov || !model) return;
  ov.innerHTML = '';
  for (const e of model.equipment || []) {
    const b = e.bbox || e.candidate_bbox; if (!b) continue;
    const cv = coverOf(e.tag);
    const d = document.createElement('div');
    d.className = 'eqb' + (cv.c ? ' done' : cv.n ? ' some' : '') + (e.tag === curTag ? ' cur' : '');
    d.style.cssText = `left:${b[0]*100}%;top:${b[1]*100}%;width:${(b[2]-b[0])*100}%;height:${(b[3]-b[1])*100}%`;
    d.dataset.tag = e.tag;
    d.title = `${e.tag} ${e.name || ''}｜點位 ${cv.n}（確認 ${cv.c}）`;
    d.innerHTML = `<span class="lb">${esc(e.tag)}</span>` + (cv.n ? `<span class="cnt">${cv.n}</span>` : '');
    d.addEventListener('click', ev => { ev.stopPropagation(); selectTag(e.tag); });
    // 拖放目標：欄位 chip 拖到方塊上＝綁定
    d.addEventListener('dragover', ev => { ev.preventDefault(); d.classList.add('drop'); });
    d.addEventListener('dragleave', () => d.classList.remove('drop'));
    d.addEventListener('drop', async ev => { ev.preventDefault(); d.classList.remove('drop'); const col = ev.dataTransfer.getData('text/col'); if (col) await assign(col, e.tag); });
    ov.appendChild(d);
  }
}
function selectTag(tag) {
  curTag = tag; drawBoxes();
  const b = $('ov') && $('ov').querySelector(`.eqb[data-tag="${CSS.escape(tag)}"]`);
  if (b) b.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
  if (step !== 3 && sid) setStep(3); else renderPanel();
}

// ------------------------------------------------------------ 右側面板
function renderPanel() {
  const P = $('panel'), S = $('sbar');
  if (step === 1) {
    S.innerHTML = '<h2>① 選資產模型</h2><div class="sub">哪一張圖的設備要接數據？（要先在判讀工作台建過資產模型）</div>';
    P.innerHTML = `<div class="pick">${files.length ? files.map(f => `<div class="item ${f.name === drawing ? 'on' : ''}" data-f="${esc(f.name)}"><b>${esc(f.name.replace(/\.pdf$/i, ''))}</b><div class="m">${(f.size / 1024).toFixed(0)} KB</div></div>`).join('') : '<div class="empty">還沒有圖面。先到 <a href="/twin/pid/label">判讀工作台</a> 上傳並建立資產模型。</div>'}</div>`;
    P.querySelectorAll('.item').forEach(i => i.onclick = () => pickDrawing(i.dataset.f));
    return;
  }
  if (step === 2) {
    S.innerHTML = '<h2>② 選歷史數據</h2><div class="sub">資料工作台裡的資料集；一份資料可對多張圖</div>';
    P.innerHTML = `<div class="pick">${datasets.length ? datasets.map(d => `<div class="item ${d.sid === sid ? 'on' : ''}" data-s="${esc(d.sid)}"><b>${esc(d.filename || d.sid)}</b><div class="m">${(d.n_rows || 0).toLocaleString()} 列｜已對 ${d.mapped || 0}／確認 ${d.confirmed || 0}</div></div>`).join('') : '<div class="empty">資料工作台裡沒有資料集。先去 <a href="/data">上傳</a>。</div>'}</div>`;
    P.querySelectorAll('.item').forEach(i => i.onclick = () => pickDataset(i.dataset.s));
    return;
  }
  // step 3
  if (!map || !model) { S.innerHTML = '<h2>③ 綁點位</h2>'; P.innerHTML = '<div class="empty">請先完成 ① 與 ②。</div>'; return; }
  const s = map.summary;
  S.innerHTML = `<h2>③ 綁點位</h2><div class="sub">${esc(map.meta.filename || sid)}｜${(map.meta.n_rows || 0).toLocaleString()} 列${map.meta.span ? `｜${map.meta.span.start} → ${map.meta.span.end}` : ''}</div>
    <div class="stat-row">
      <div class="stat ok"><b>${s.confirmed}</b><span>已確認</span></div>
      <div class="stat warn"><b>${s.guessed}</b><span>猜的・待確認</span></div>
      <div class="stat ${s.unassigned ? 'bad' : ''}"><b>${s.unassigned}</b><span>未歸戶</span></div>
      <div class="stat"><b>${s.equipment_covered}／${s.equipment_total}</b><span>設備有數據</span></div>
    </div>`;
  const pool = map.points.filter(p => !p.tag && !p.ignored);
  const guessedAll = map.points.filter(p => p.guess && p.tag && !p.ignored && (p.guess_conf || 0) >= 0.85);
  const e = curTag ? (model.equipment || []).find(x => x.tag === curTag) : null;
  const pts = curTag ? map.points.filter(p => p.tag === curTag && !p.ignored) : [];
  P.innerHTML = `
    <div class="section-title">${e ? `${esc(e.tag)}　${esc(e.name || e.type || '')}` : '點左圖任一設備'}
      ${e ? `<span class="hint" style="font-weight:400;letter-spacing:0">　${pts.length} 個點位</span>` : ''}</div>
    ${e ? (pts.length ? pts.map(ptCard).join('') + '<canvas id="series"></canvas><div class="hint" id="series-cap">點任一卡片看趨勢</div>' : '<div class="empty">這台設備還沒有數據欄位。把下面「未歸戶」的欄位拖到左圖它的方塊上。</div>') : ''}
    <div class="section-title">未歸戶欄位（${pool.length}）<span class="hint" style="font-weight:400;letter-spacing:0">　拖到左圖方塊上綁定；全廠狀態欄可忽略</span></div>
    <div class="pool">${pool.length ? pool.map(p => `<span class="chip" draggable="true" data-col="${esc(p.col)}" title="平均 ${fmt(p.stats.mean)}｜${fmt(p.stats.min)}～${fmt(p.stats.max)}">${esc(p.col)}<span class="m">${fmt(p.stats.mean)}</span><span class="x" data-ign="${esc(p.col)}" title="忽略">×</span></span>`).join('') : '<span class="hint">全部欄位都歸戶了。</span>'}</div>
    ${guessedAll.length ? `<div class="section-title">系統猜的（${guessedAll.length}）</div>
      <button class="mini-btn primary" id="confirm-all" style="width:100%">把 ${guessedAll.length} 個高信心猜測全部確認</button>
      <div class="hint" style="margin-top:4px">${[...new Set(guessedAll.map(p => p.tag))].map(t => `${esc(t)}×${guessedAll.filter(p => p.tag === t).length}`).join('、')}</div>` : ''}
    <div class="hint" style="margin-top:12px">左圖顏色：綠＝有已確認點位、琥珀＝只有猜的、灰＝沒數據。</div>`;
  bindPanel();
}
function spark(h) { if (!h || !h.length) return ''; const mx = Math.max(...h, 1); return `<span class="spark">${h.map(v => `<i style="height:${Math.max(2, v / mx * 16)}px"></i>`).join('')}</span>`; }
function optList(arr, cur) { const has = arr.includes(cur); return arr.map(v => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(v || '（無）')}</option>`).join('') + (has || !cur ? '' : `<option value="${esc(cur)}" selected>${esc(cur)}</option>`); }
function ptCard(p) {
  const st = p.stats || {};
  const state = p.confirmed ? '<span class="badge done">已確認</span>' : p.guess ? `<span class="badge guess">猜的 ${Math.round((p.guess_conf || 0) * 100)}%</span>` : '<span class="badge">待確認</span>';
  return `<div class="pt ${p.confirmed ? 'done' : p.guess ? 'guess' : ''}" data-col="${esc(p.col)}">
    <div class="h"><span class="col" title="${esc(p.col)}">${esc(p.col)}</span>${state}<span class="x" data-unassign="${esc(p.col)}" title="解除綁定（回未歸戶）">×</span></div>
    <div class="stats">${spark(st.hist)}<span>平均 <b>${fmt(st.mean)}</b></span><span>${fmt(st.min)}～${fmt(st.max)}</span><span>缺 ${st.missing_pct}%</span>${st.n_unique <= 3 ? `<span class="g guess">只有 ${st.n_unique} 種值</span>` : ''}</div>
    <div class="form">
      <div><label>子部件</label><input data-f="sub" value="${esc(p.sub || '')}" placeholder="M20"/></div>
      <div><label>量測項</label><select data-f="measure">${optList(MEASURES, p.measure || '')}</select></div>
      <div><label>單位</label><select data-f="unit">${optList(UNITS, p.unit || '')}</select></div>
      <div><label>統計</label><input data-f="stat" value="${esc(p.stat || '')}" placeholder="平均"/></div>
      <div style="grid-column:span 2"><label>合理範圍 <span class="g ${p.range_by === 'manual' ? 'man' : 'guess'}">${p.range_by === 'manual' ? '人工設定' : '系統推定 p1～p99'}</span></label>
        <div class="rng"><input data-f="lo" value="${p.lo == null ? '' : fmt(p.lo)}"/> ～ <input data-f="hi" value="${p.hi == null ? '' : fmt(p.hi)}"/></div></div>
    </div>
    <div class="act"><span class="g">${p.by ? '由 ' + esc(p.by.split('@')[0]) + ' 確認' : ''}</span>
      <button class="mini-btn primary" data-ok="${esc(p.col)}">${p.confirmed ? '更新' : '確認 ✓'}</button></div>
  </div>`;
}
function bindPanel() {
  const P = $('panel');
  P.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/col', c.dataset.col); c.classList.add('drag'); });
    c.addEventListener('dragend', () => c.classList.remove('drag'));
    // 點 chip 也能綁到目前選中的設備（不想拖的人）
    c.addEventListener('click', e => { if (e.target.classList.contains('x')) return; if (curTag) assign(c.dataset.col, curTag); else alert('先在左圖點一台設備，或把欄位拖到方塊上'); });
  });
  P.querySelectorAll('[data-ign]').forEach(x => x.onclick = async e => { e.stopPropagation(); await bulk([x.dataset.ign], 'ignore'); await reloadMap(); });
  P.querySelectorAll('[data-unassign]').forEach(x => x.onclick = async () => { await bulk([x.dataset.unassign], 'clear'); await reloadMap(); });
  P.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => saveCard(b.dataset.ok));
  P.querySelectorAll('.pt').forEach(card => card.addEventListener('click', e => { if (e.target.closest('input,select,button,.x')) return; showSeries(card.dataset.col); }));
  const ca = $('confirm-all'); if (ca) ca.onclick = async () => {
    const cols = map.points.filter(p => p.guess && p.tag && !p.ignored && (p.guess_conf || 0) >= 0.85).map(p => p.col);
    if (!confirm(`把 ${cols.length} 個系統猜測直接標為已確認？之後仍可逐個改。`)) return;
    await bulk(cols, 'confirm'); await reloadMap();
  };
}
async function assign(col, tag) {
  const p = map.points.find(z => z.col === col); if (!p) return;
  const eq = (map.equipment || []).find(e => e.tag === tag);
  const body = { col, tag, drawing: eq ? eq.drawing : drawing, sub: p.sub || '', measure: p.measure || '', unit: p.unit || '', stat: p.stat || '',
    lo: p.lo, hi: p.hi, range_by: p.range_by || 'system', note: '', confirmed: false };
  await getJSON(`/api/pid/mapping/${encodeURIComponent(sid)}/point`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  curTag = tag; await reloadMap();
}
async function saveCard(col) {
  const card = document.querySelector(`.pt[data-col="${CSS.escape(col)}"]`); const p = map.points.find(z => z.col === col);
  const g = f => card.querySelector(`[data-f="${f}"]`)?.value ?? '';
  const lo = g('lo') === '' ? null : parseFloat(g('lo')), hi = g('hi') === '' ? null : parseFloat(g('hi'));
  const changed = (lo !== null && Math.abs(lo - (p.lo ?? NaN)) > 1e-9) || (hi !== null && Math.abs(hi - (p.hi ?? NaN)) > 1e-9);
  const body = { col, tag: p.tag, drawing: p.drawing || drawing, sub: g('sub').trim(), measure: g('measure'), unit: g('unit'), stat: g('stat').trim(),
    lo, hi, range_by: (changed || p.range_by === 'manual') ? 'manual' : 'system', note: '', confirmed: true };
  await getJSON(`/api/pid/mapping/${encodeURIComponent(sid)}/point`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  await reloadMap();
}
async function bulk(cols, action) { return getJSON(`/api/pid/mapping/${encodeURIComponent(sid)}/bulk`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cols, action }) }); }
async function showSeries(col) {
  const cv = $('series'); if (!cv) return;
  const d = await getJSON(`/api/pid/mapping/${encodeURIComponent(sid)}/series?col=${encodeURIComponent(col)}`);
  const ctx = cv.getContext('2d'); const W = cv.width = cv.clientWidth, H = cv.height = 80; ctx.clearRect(0, 0, W, H);
  const vs = d.v.filter(v => v != null); if (!vs.length) return;
  const mn = Math.min(...vs), mx = Math.max(...vs) || 1;
  ctx.strokeStyle = '#046AFB'; ctx.lineWidth = 1.2; ctx.beginPath();
  d.v.forEach((v, i) => { if (v == null) return; const x = i / (d.v.length - 1) * W, y = H - 4 - (v - mn) / (mx - mn || 1) * (H - 8); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  $('series-cap').textContent = `${col}｜${d.t[0]} → ${d.t[d.t.length - 1]}｜${fmt(mn)} ～ ${fmt(mx)}`;
}
init();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P&ID 管理｜Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* 全平台統一：藍白 */
      --bg: #F6F7FA; --panel: #ffffff; --panel2: #F1F3F6;
      --bdr: #DBDDE0; --accent: #046AFB; --accent-deep: #E3EDFE;
      --text: #061027; --dim: #5C6773;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 14px; }
    .layout { display: flex; height: 100vh; }
    aside {
      width: 320px; flex-shrink: 0; border-right: 1px solid var(--bdr);
      padding: 18px; overflow-y: auto; background: var(--panel);
    }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .brand-home {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px;
      background: rgba(4, 106, 251, 0.08); border: 1px solid var(--bdr);
      color: var(--accent); font-size: 11px; font-weight: 700; text-decoration: none;
    }
    h1 { font-size: 16px; font-weight: 700; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--accent);
      letter-spacing: 1px; margin: 18px 0 10px; }
    .drop {
      border: 1.5px dashed var(--bdr); border-radius: 10px; padding: 22px;
      text-align: center; color: var(--dim); font-size: 13px; cursor: pointer;
      transition: border-color 0.2s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
    .drop input { display: none; }
    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
      background: var(--panel2); border: 1px solid var(--bdr); font-size: 13px;
    }
    .file-item:hover, .file-item.active { border-color: var(--accent); }
    .file-item .size { color: var(--dim); font-size: 11px; }
    .file-actions { display: flex; gap: 6px; margin-top: 6px; }
    .mini-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 11.5px; cursor: pointer;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text);
      text-decoration: none; font-family: inherit; display: inline-block;
    }
    .mini-btn:hover { border-color: var(--accent); }
    .mini-btn.primary { background: var(--accent-deep); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .mini-btn:disabled { opacity: 0.5; pointer-events: none; }
    .roadmap {
      border: 1px solid var(--bdr); border-radius: 10px; padding: 14px;
      background: var(--panel2);
    }
    .roadmap .tag { display: inline-block; font-size: 10px; font-weight: 700;
      letter-spacing: 1px; color: #fff; background: var(--dim);
      padding: 2px 8px; border-radius: 8px; margin-bottom: 8px; }
    .roadmap p { color: var(--dim); font-size: 12.5px; line-height: 1.7; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    main iframe { width: 100%; height: 100%; border: 0; background: #E9EDF2; }
    #placeholder { color: var(--dim); font-size: 14px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="head">
        <a class="brand-home" href="/" title="回平台首頁">⌂</a>
        <h1>P&amp;ID 管理</h1>
      </div>

      <div class="section-title">上傳圖面</div>
      <label class="drop" id="drop">
        點擊或拖放 PDF 圖面
        <input type="file" id="file-input" accept=".pdf" multiple />
      </label>

      <div class="section-title">整廠場景</div>
      <button class="mini-btn primary" id="parse-all-btn" style="width:100%;padding:8px 10px">
        全部解析建模（批次 OCR → 整廠場景）</button>
      <div id="batch-progress" style="display:none;margin-top:8px;font-size:12px;color:var(--dim);line-height:1.6"></div>
      <div id="merged-links" style="display:none;margin-top:8px;gap:6px"></div>

      <div class="section-title">圖面清單</div>
      <div id="file-list"><span style="color:var(--dim);font-size:12px">尚無圖面</span></div>

      <div class="section-title">3D 場景建置</div>
      <div class="roadmap" style="margin-bottom:10px">
        <p>依 P&amp;ID 規劃設備配置後，使用
          <a href="/studio" style="color:var(--accent)">3D 設計工作室</a>
          放置對應的工業素材，即可產生可接數據的孿生場景。</p>
      </div>
      <div class="roadmap">
        <span class="tag">ROADMAP</span>
        <p>4K 實拍影片 → 3D 影像模型：現場繞行拍攝影片上傳後自動重建
          實景 3D（3DGS／mesh），與素材場景疊合。此區域保留，
          重建管線已於平台文件定義。</p>
      </div>
    </aside>
    <main>
      <span id="placeholder">選擇左側圖面以檢視</span>
      <iframe id="viewer" style="display:none"></iframe>
    </main>
  </div>

  <script>
    const listEl = document.getElementById('file-list');
    const viewer = document.getElementById('viewer');
    const placeholder = document.getElementById('placeholder');

    async function refresh() {
      const files = await fetch('/api/pid/list').then(r => r.json());
      listEl.innerHTML = files.length ? files.map(f =>
        `<div class="file-item" data-name="${f.name}">
           <div style="flex:1;min-width:0">
             <div style="display:flex;justify-content:space-between;align-items:center">
               <span style="overflow:hidden;text-overflow:ellipsis">${f.name}</span>
               <span class="size">${(f.size / 1024).toFixed(0)} KB</span>
             </div>
             <div class="file-actions">
               <button class="mini-btn parse-btn" data-name="${f.name}">${f.scene_id ? '重新解析' : '解析建模'}</button>
               ${f.scene_id ? `<a class="mini-btn" href="/studio?scene=${f.scene_id}">設計工作室開啟</a>
               <a class="mini-btn" href="/twin?scene=${f.scene_id}" target="_blank">孿生檢視</a>
               <a class="mini-btn primary" href="/static/pid_live.html?scene=${f.scene_id}" target="_blank">▶ 運轉畫面</a>` : ''}
             </div>
           </div>
         </div>`).join('') : '<span style="color:var(--dim);font-size:12px">尚無圖面</span>';
      listEl.querySelectorAll('.file-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.mini-btn')) return;
          listEl.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          placeholder.style.display = 'none';
          viewer.style.display = '';
          viewer.src = `/uploads/pid/${encodeURIComponent(el.dataset.name)}`;
        });
      });
      listEl.querySelectorAll('.parse-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          btn.textContent = '解析中…（OCR 約 20-60 秒）';
          btn.disabled = true;
          const res = await fetch(`/api/pid/parse/${encodeURIComponent(btn.dataset.name)}`, { method: 'POST' })
            .then(r => { if (!r.ok) throw r; return r.json(); }).catch(() => null);
          if (!res) { btn.textContent = '解析失敗'; btn.disabled = false; return; }
          showResult(res, btn.dataset.name);
          refresh();
        });
      });
    }

    function showResult(res, name) {
      placeholder.style.display = 'none';
      viewer.style.display = 'none';
      let panel = document.getElementById('result-panel');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'result-panel';
        panel.style.cssText = 'padding:28px;max-width:560px;overflow-y:auto;max-height:100%';
        document.querySelector('main').appendChild(panel);
      }
      panel.style.display = '';
      panel.innerHTML = `
        <h2 style="font-size:17px;margin-bottom:6px">解析完成｜${name}</h2>
        <p style="color:var(--dim);font-size:13px;margin-bottom:14px">
          OCR 命中 ${res.ocr_hits}｜抓到 <b style="color:var(--accent)">${res.equipment} 台設備</b>、
          ${res.instruments} 個儀錶位號（已自動掛最近設備）</p>
        <div style="display:flex;gap:10px;margin-bottom:16px">
          <a class="mini-btn primary" href="/studio?scene=${res.scene_id}">在設計工作室開啟草稿（修改/刪誤抓）</a>
          <a class="mini-btn" href="/twin?scene=${res.scene_id}" target="_blank">孿生檢視</a>
          <a class="mini-btn" href="/static/pid_live.html?scene=${res.scene_id}" target="_blank">▶ 運轉畫面</a>
        </div>
        <table style="border-collapse:collapse;font-size:12.5px;width:100%">
          <tr style="color:var(--dim)"><th style="text-align:left;padding:4px 8px">位號</th>
          <th style="text-align:left;padding:4px 8px">類型</th><th style="text-align:left;padding:4px 8px">信心</th></tr>
          ${res.items.map(it => `<tr style="border-top:1px solid var(--bdr)">
            <td style="padding:4px 8px;font-weight:600">${it.tag}</td>
            <td style="padding:4px 8px">${it.type}</td>
            <td style="padding:4px 8px;color:${it.conf >= 0.8 ? 'var(--ok, #35e08c)' : 'var(--dim)'}">${it.conf}</td></tr>`).join('')}
        </table>
        <p style="color:var(--dim);font-size:12px;margin-top:12px;line-height:1.7">
          草稿哲學：寧可多抓給你刪。低信心項多為誤抓，開編輯器點選後 Delete 即可；
          位置佈局按圖面相對位置自動排開，可拖曳調整。</p>`;
    }

    // ------------------------------------------------ 批次解析 → 整廠場景
    const allBtn = document.getElementById('parse-all-btn');
    const progEl = document.getElementById('batch-progress');
    const mergedEl = document.getElementById('merged-links');
    let pollTimer = null;

    function renderBatchStatus(st) {
      if (st.state === 'running') {
        allBtn.disabled = true;
        progEl.style.display = '';
        progEl.textContent = `批次解析中 ${st.done}/${st.total}｜${st.current || ''}（已 ${st.elapsed || 0} 秒）`;
        if (!pollTimer) pollTimer = setInterval(pollBatch, 3000);
      } else {
        allBtn.disabled = false;
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        if (st.state === 'done') {
          progEl.style.display = '';
          progEl.textContent = `批次完成：${st.sheets} 張圖｜整廠 ${st.equipment} 台設備、${st.instruments} 個儀錶`
            + (Object.keys(st.errors || {}).length ? `｜失敗 ${Object.keys(st.errors).length} 張` : '');
          if (st.merged_scene_id) {
            mergedEl.style.display = 'flex';
            mergedEl.innerHTML =
              `<a class="mini-btn primary" href="/studio?scene=${st.merged_scene_id}">整廠場景：設計工作室開啟</a>
               <a class="mini-btn" href="/twin?scene=${st.merged_scene_id}" target="_blank">孿生檢視</a>
               <a class="mini-btn" href="/static/pid_live.html?scene=${st.merged_scene_id}" target="_blank">▶ 運轉畫面</a>`;
          }
        } else {
          progEl.style.display = 'none';
        }
      }
    }

    async function pollBatch() {
      const st = await fetch('/api/pid/parse_all/status').then(r => r.json()).catch(() => null);
      if (st) { renderBatchStatus(st); if (st.state === 'done' && !pollTimer) refresh(); }
    }

    allBtn.addEventListener('click', async () => {
      allBtn.disabled = true;
      progEl.style.display = '';
      progEl.textContent = '啟動批次解析…（每張約 20-60 秒，可離開此頁）';
      await fetch('/api/pid/parse_all', { method: 'POST' }).catch(() => null);
      if (!pollTimer) pollTimer = setInterval(pollBatch, 3000);
    });
    pollBatch();  // 頁面載入時還原批次狀態（進行中/已完成的整廠場景入口）

    const drop = document.getElementById('drop');
    const input = document.getElementById('file-input');
    async function upload(files) {
      for (const f of files) {
        const fd = new FormData();
        fd.append('file', f);
        await fetch('/api/pid/upload', { method: 'POST', body: fd });
      }
      refresh();
    }
    input.addEventListener('change', () => upload(input.files));
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('over');
      upload(e.dataTransfer.files);
    });
    refresh();
  </script>
</body>
</html>

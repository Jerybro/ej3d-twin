<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>製程建議｜Process Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F7FA; --panel: #fff; --panel2: #F1F3F6; --bdr: #DBDDE0;
      --accent: #046AFB; --deep: #E3EDFE; --text: #061027; --dim: #5C6773;
      --hi: #12A150; --mid: #E0A415; --lo: #D93F3F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 13px; }
    button, select, input { font: inherit; }

    .top { height: 52px; flex-shrink: 0; background: var(--panel); border-bottom: 1px solid var(--bdr);
      display: flex; align-items: center; gap: 10px; padding: 0 16px; }
    .brand-home { display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px;
      border-radius: 6px; background: rgba(4,106,251,.08); border: 1px solid var(--bdr); color: var(--accent);
      font-size: 15px; font-weight: 700; text-decoration: none; }
    .top h1 { font-size: 14.5px; font-weight: 700; }
    .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 9px; white-space: nowrap; }
    .tag.real { background: rgba(18,161,80,.12); color: #0B5A2E; border: 1px solid rgba(18,161,80,.4); }
    .tag.sim { background: rgba(224,164,21,.14); color: #7A5400; border: 1px solid rgba(224,164,21,.45); }
    .top .sp { flex: 1; }
    .top .meta { font-size: 11px; color: var(--dim); }
    .mini-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      background: var(--panel2); border: 1px solid var(--bdr); color: var(--text); text-decoration: none; }
    .mini-btn:hover { border-color: var(--accent); }
    .mini-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .mini-btn:disabled { opacity: .4; pointer-events: none; }
    .seg { display: inline-flex; border: 1px solid var(--bdr); border-radius: 7px; overflow: hidden; }
    .seg button { padding: 5px 11px; border: 0; border-left: 1px solid var(--bdr); background: transparent;
      color: var(--dim); font-size: 12px; cursor: pointer; }
    .seg button:first-child { border-left: 0; }
    .seg button.on { background: var(--deep); color: var(--accent); font-weight: 600; }
    .hint { font-size: 11.5px; color: var(--dim); line-height: 1.6; }

    .main { display: flex; height: calc(100vh - 52px); }
    .canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .cbar { height: 42px; flex-shrink: 0; border-bottom: 1px solid var(--bdr); background: var(--panel);
      display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 12px; }
    .cbar .sp { flex: 1; }
    #stage { flex: 1; overflow: auto; background: #E9EDF2; position: relative; }
    #stage.empty { display: grid; place-items: center; color: var(--dim); }
    #wrap { position: relative; display: inline-block; }
    #img { display: block; user-select: none; -webkit-user-drag: none; }
    #ov { position: absolute; inset: 0; }

    /* 聚光燈：框外整片壓暗，只留當前這一台。不畫連線、不重複設備名——
       圖上本來就寫著位號與名稱，再疊一次只會糊掉。 */
    .spot { position: absolute; border: 2.5px solid var(--accent); border-radius: 5px;
      box-shadow: 0 0 0 3px rgba(255,255,255,.95), 0 0 0 9999px rgba(6,16,39,.42);
      pointer-events: none; transition: all .35s cubic-bezier(.4,0,.2,1); }
    .spot .no { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
      display: grid; place-items: center; border: 2px solid #fff; }
    .spot .badge { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 10px);
      white-space: nowrap; background: var(--accent); color: #fff; padding: 5px 11px; border-radius: 7px;
      font-size: 13px; font-weight: 700; box-shadow: 0 3px 12px rgba(4,106,251,.35); }
    .spot .badge s { text-decoration: none; opacity: .68; font-weight: 400; }
    .spot.done { border-color: var(--hi); }
    .spot.done .no, .spot.done .badge { background: var(--hi); box-shadow: 0 3px 12px rgba(18,161,80,.3); }
    /* 總覽：三台同時亮，不壓暗 */
    .mark { position: absolute; border: 2.5px solid var(--accent); border-radius: 5px;
      box-shadow: 0 0 0 3px rgba(255,255,255,.9); cursor: pointer; }
    .mark.done { border-color: var(--hi); }
    .mark .no { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: grid;
      place-items: center; border: 2px solid #fff; }
    .mark.done .no { background: var(--hi); }

    .side { width: clamp(400px, 42vw, 560px); flex-shrink: 0; border-left: 1px solid var(--bdr);
      background: var(--panel); display: flex; flex-direction: column; }
    .sbar { padding: 11px 15px; border-bottom: 1px solid var(--bdr); display: flex; align-items: center; gap: 8px; }
    .sbar h2 { font-size: 14px; font-weight: 700; }
    .sbar .sp { flex: 1; }
    .scroll { flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
    .navbar { display: flex; align-items: center; gap: 8px; padding: 9px 15px;
      border-bottom: 1px solid var(--bdr); background: var(--panel2); }
    .navbar .who { font-size: 12px; color: var(--dim); }
    .navbar .who b { color: var(--text); font-size: 13px; }
    .navbar .sp { flex: 1; }
    .dots { display: inline-flex; gap: 5px; align-items: center; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: #C3CAD2; }
    .dots i.on { background: var(--accent); width: 18px; border-radius: 4px; }
    .dots i.done { background: var(--hi); }

    /* 模型卡 */
    .blk { border: 1px solid var(--bdr); border-radius: 10px; background: var(--panel2);
      padding: 11px 13px; margin-bottom: 9px; }
    .blk > h3 { font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: .6px;
      margin-bottom: 7px; display: flex; align-items: center; gap: 7px; }
    .blk > h3 i { flex: 1; height: 1px; background: var(--bdr); font-style: normal; }
    .blk.head { background: var(--deep); border-color: rgba(4,106,251,.3); }
    .eqline { display: flex; align-items: baseline; gap: 9px; }
    .eqline b { font-size: 21px; letter-spacing: .3px; }
    .eqline span { color: var(--dim); font-size: 13px; }
    .ttag { margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 8px;
      background: var(--accent); color: #fff; white-space: nowrap; }
    .ttag.soft_sensor { background: #7C4DFF; }
    .ttag.quality { background: var(--mid); }
    /* .eqline span / .ovcard .t span 的灰字會蓋掉 .ttag 的白字（選擇器優先權），
       所以徽章的顏色與字級要用更明確的選擇器再寫一次 */
    .eqline .ttag, .ovcard .t .ttag { color: #fff; font-size: 11px; }
    .eqline .ttag.quality, .ovcard .t .ttag.quality { color: #3d2a00; }
    .obj { font-size: 12.5px; line-height: 1.7; margin-top: 6px; }
    .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 4px 0;
      border-top: 1px dashed var(--bdr); }
    .kv:first-of-type { border-top: 0; }
    .kv .k { color: var(--dim); }
    .kv .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .kv .v.ok { color: #0B5A2E; } .kv .v.no { color: var(--lo); }
    .reco { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed rgba(18,161,80,.45); flex-wrap: wrap; }
    .reco .from { font-size: 15px; color: var(--dim); text-decoration: line-through; }
    .reco .arrow { color: var(--dim); }
    .reco .to { font-size: 24px; font-weight: 700; color: #0B5A2E; letter-spacing: .3px; }
    .reco .eff { margin-left: auto; font-size: 12.5px; font-weight: 700; color: #0B5A2E;
      background: rgba(18,161,80,.13); padding: 3px 10px; border-radius: 8px; }
    .band { position: relative; height: 26px; margin: 8px 0 2px; }
    .band .rail { position: absolute; left: 0; right: 0; top: 13px; height: 4px; border-radius: 2px; background: #DDE3EA; }
    .band .in { position: absolute; top: 13px; height: 4px; border-radius: 2px; background: rgba(4,106,251,.35); }
    .band .pin { position: absolute; top: 6px; width: 3px; height: 18px; border-radius: 2px; background: var(--accent); }
    .band .lbl { position: absolute; top: 0; font-size: 10.5px; color: var(--dim); }
    .chk { display: grid; grid-template-columns: 1fr auto auto auto; gap: 3px 10px; font-size: 11.5px; align-items: center; }
    .chk .hd { color: var(--dim); font-size: 10.5px; }
    .chk .n { font-variant-numeric: tabular-nums; text-align: right; }
    .chk .st { font-weight: 700; }
    .chk .st.ok { color: var(--hi); } .chk .st.no { color: var(--lo); }
    .feat { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 7px;
      background: #fff; border: 1px solid var(--bdr); margin: 2px 3px 0 0; }
    .carry { font-size: 11.5px; color: var(--hi); font-weight: 600; margin-bottom: 8px; }
    .ovcard { border: 1px solid var(--bdr); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
      background: var(--panel2); cursor: pointer; }
    .ovcard:hover { border-color: var(--accent); }
    .ovcard.done { border-color: rgba(18,161,80,.5); background: rgba(18,161,80,.06); }
    .ovcard .t { display: flex; align-items: baseline; gap: 8px; }
    .ovcard .t b { font-size: 15px; }
    .ovcard .t span { color: var(--dim); font-size: 12px; }
    .sum { border: 1.5px solid var(--hi); border-radius: 10px; background: rgba(18,161,80,.07);
      padding: 12px 14px; margin-top: 4px; }
    .sum h3 { font-size: 12px; font-weight: 700; color: #0B5A2E; margin-bottom: 8px; }
    .sum .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
    .sum .row b { color: #0B5A2E; font-variant-numeric: tabular-nums; }
    /* 專業術語一律：畫面上講人話，精確定義放 ? 滑過才看 */
    .q { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%;
      border: 1px solid var(--dim); color: var(--dim); font-size: 10px; font-weight: 700; cursor: help;
      position: relative; vertical-align: 1px; margin-left: 5px; flex-shrink: 0; letter-spacing: 0; }
    .q:hover { border-color: var(--accent); color: var(--accent); }
    .q::after { content: attr(data-tip); position: absolute; right: -4px; top: calc(100% + 7px);
      width: 264px; background: #061027; color: #fff; padding: 9px 11px; border-radius: 8px;
      font-size: 11.5px; font-weight: 400; line-height: 1.7; text-align: left; letter-spacing: 0;
      opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 60; white-space: normal;
      box-shadow: 0 8px 24px rgba(6,16,39,.3); }
    .q:hover::after { opacity: 1; }
    .blk > h3 .q { margin-left: 0; }
    /* 來源綁定 */
    .srcrow { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 0;
      border-top: 1px dashed var(--bdr); }
    .srcrow .k { color: var(--dim); }
    .srcrow .sp { flex: 1; }
    .conn { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
      background: rgba(92,103,115,.12); color: var(--dim); white-space: nowrap; }
    .conn.live { background: rgba(18,161,80,.14); color: #0B5A2E; }
    .srcform { border: 1px solid var(--accent); border-radius: 9px; background: #fff;
      padding: 10px 11px; margin-top: 8px; }
    .srcform select, .srcform input { width: 100%; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--bdr); background: var(--panel2); font-size: 12px; }
    .srcform .g { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center;
      margin-top: 6px; font-size: 11.5px; }
    .srcform .g span { color: var(--dim); }
    .srcform .act { display: flex; gap: 6px; margin-top: 9px; }
    .srcform .act .mini-btn { flex: 1; text-align: center; }
    /* 主要因子：名稱＋貢獻佔比條 */
    .fi { display: grid; grid-template-columns: 1fr 80px 42px; gap: 4px 8px; align-items: center;
      font-size: 11.5px; margin-top: 4px; }
    .fi .bar { height: 6px; border-radius: 3px; background: #DDE3EA; overflow: hidden; }
    .fi .bar i { display: block; height: 100%; background: var(--accent); }
    .fi .pc { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }

    .api summary { cursor: pointer; font-size: 12px; font-weight: 700; color: var(--accent); outline: none; padding: 6px 0; }
    .api pre { background: #0E1524; color: #D7E3F4; border-radius: 9px; padding: 12px 14px;
      font-size: 10.5px; line-height: 1.6; overflow-x: auto; font-family: Consolas, monospace; max-height: 320px; }
  </style>
</head>
<body>
  <div class="top">
    <a class="brand-home" href="/" title="回首頁">⌂</a>
    <h1>製程建議</h1>
    <span class="tag real" id="tag-real">資產模型：載入中</span>
    <span class="tag sim">點位數值：模擬</span>
    <span class="sp"></span>
    <a class="mini-btn" href="/twin/mapping">← 點位對照</a>
    <span class="meta" id="ver"></span>
  </div>

  <div class="main">
    <div class="canvas">
      <div class="cbar">
        <span class="seg" id="mode">
          <button data-m="blind" class="on">盲重建</button>
          <button data-m="annot">標示</button>
          <button data-m="trace">描圖</button>
        </span>
        <span class="seg"><button id="zo">−</button><button id="zi">＋</button><button id="zf">全圖</button></span>
        <span class="sp"></span>
        <span class="hint" id="cap"></span>
      </div>
      <div id="stage" class="empty"><span>載入資產模型…</span></div>
    </div>

    <div class="side">
      <div class="sbar">
        <h2 id="side-title">導覽</h2>
        <span class="sp"></span>
        <span class="seg" id="view">
          <button data-v="nav" class="on">導覽</button>
          <button data-v="all">總覽</button>
        </span>
        <button class="mini-btn primary" id="run">開始</button>
      </div>
      <div class="navbar" id="navbar" style="display:none">
        <button class="mini-btn" id="prev">‹</button>
        <span class="who" id="who"></span>
        <span class="sp"></span>
        <span class="dots" id="dots"></span>
        <button class="mini-btn" id="next">›</button>
      </div>
      <div class="scroll" id="panel"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
async function getJSON(u, o) { const r = await fetch(u, o); const t = await r.text(); let d = null; try { d = JSON.parse(t); } catch {} if (!r.ok) throw new Error((d && d.detail) || ('伺服器錯誤 ' + r.status)); return d; }
const f2 = v => v == null ? '—' : (Math.abs(v) >= 100 ? (+v).toFixed(0) : Math.abs(v) >= 10 ? (+v).toFixed(1) : (+v).toFixed(2));
const when = s => s ? String(s).replace('T', ' ').slice(5, 16) : '';
const who = s => (s || '').split('@')[0] || '（免登入）';
// 術語小幫手：畫面寫人話，精確定義滑過 ? 才出現
const q = t => '<span class="q" data-tip="' + esc(t) + '">?</span>';
const pct1 = v => v == null ? '—' : (v * 100).toFixed(1) + '%';
const TASK_TIP = {
  optimize: '最佳化：告訴系統你要什麼（最省電、又要守住品質），系統反推設定該調到多少。',
  soft_sensor: '虛擬量測：這個量現場量不到（沒儀器、或只能離線化驗），用量得到的其他數據即時推算出來。',
  quality: '品質預測：在做完之前先預估品質會是多少，來得及在做壞之前調整。',
};

let state = null, results = [], mode = 'blind', view = 'nav', step = 0, zoom = 1, baseW = 1600, baseH = 1131;
const byAsset = () => Object.fromEntries(results.map(r => [r.asset, r]));

/* ---------------- 左：資產模型＋聚光燈 ---------------- */
function imgUrl() {
  const f = encodeURIComponent(state.drawing);
  return mode === 'annot' ? `/api/pid/model/${f}/annotated.jpg?t=${Date.now()}`
                          : `/api/pid/model/${f}/rebuild.svg?mode=${mode}&notes=0&t=${Date.now()}`;
}
function loadImage() {
  const st = $('stage');
  if (!state.model_ok) { st.className = 'empty'; st.innerHTML = '<span>這個網域還沒建立 M0200 資產模型</span>'; return; }
  st.className = '';
  st.innerHTML = `<div id="wrap"><img id="img" src="${esc(imgUrl())}" draggable="false"/><div id="ov"></div></div>`;
  const img = $('img');
  img.onload = () => { baseW = img.naturalWidth || 1600; baseH = img.naturalHeight || Math.round(baseW * (state.aspect || .707)); drawStage(); };
  img.onerror = () => { st.className = 'empty'; st.innerHTML = '<span>資產模型圖載入失敗</span>'; };
  bindPan();
}
function applyZoom() { const i = $('img'); if (i) i.style.width = Math.round(baseW * zoom) + 'px'; }
function bindPan() {
  const st = $('stage'), ov = $('ov');
  ov.addEventListener('pointerdown', e => {
    if (e.target !== ov) return;
    const sx = e.clientX, sy = e.clientY, l0 = st.scrollLeft, t0 = st.scrollTop; ov.style.cursor = 'grabbing';
    const mv = ev => { st.scrollLeft = l0 - (ev.clientX - sx); st.scrollTop = t0 - (ev.clientY - sy); };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); ov.style.cursor = ''; };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}
function zoomTo(box, padRatio) {
  const st = $('stage'), pad = padRatio == null ? .9 : padRatio;
  const w = (box[2] - box[0]) / pad, h = (box[3] - box[1]) / pad;
  zoom = Math.min(4, Math.max(.05, Math.min((st.clientWidth - 20) / (baseW * w), (st.clientHeight - 20) / (baseH * h))));
  applyZoom();
  const cx = (box[0] + box[2]) / 2 * baseW * zoom, cy = (box[1] + box[3]) / 2 * baseH * zoom;
  const go = () => { st.scrollLeft = cx - st.clientWidth / 2; st.scrollTop = cy - st.clientHeight / 2; };
  setTimeout(go, 0); setTimeout(go, 180);
}
function allBox() {
  const bs = state.chain.map(e => e.bbox).filter(Boolean);
  return bs.length ? [Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])),
                      Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3]))] : null;
}
function drawStage() {
  const ov = $('ov'); if (!ov || !state.model_ok) return;
  const done = byAsset();
  ov.innerHTML = '';
  if (view === 'nav') {
    const eq = state.chain[step]; if (!eq || !eq.bbox) return;
    const r = done[eq.tag], b = eq.bbox;
    const d = document.createElement('div');
    d.className = 'spot' + (r ? ' done' : '');
    d.style.cssText = `left:${b[0]*100}%;top:${b[1]*100}%;width:${(b[2]-b[0])*100}%;height:${(b[3]-b[1])*100}%`;
    const now = r && r.detail && r.detail.objective ? r.detail.objective.now : '';
    d.innerHTML = `<span class="no">${step + 1}</span>` +
      (r ? `<span class="badge"><s>${esc(eq.knob.label)} ${esc(now)}</s> → ${esc(r.value)} ${esc(r.unit)}</span>` : '');
    ov.appendChild(d);
    zoomTo(b, .5);
  } else {
    state.chain.forEach((eq, i) => {
      if (!eq.bbox) return;
      const r = done[eq.tag], b = eq.bbox;
      const d = document.createElement('div');
      d.className = 'mark' + (r ? ' done' : '');
      d.style.cssText = `left:${b[0]*100}%;top:${b[1]*100}%;width:${(b[2]-b[0])*100}%;height:${(b[3]-b[1])*100}%`;
      d.innerHTML = `<span class="no">${i + 1}</span>`;
      d.onclick = () => { step = i; setView('nav'); };
      ov.appendChild(d);
    });
    const bb = allBox(); if (bb) zoomTo(bb, .82);
  }
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b));
  if (state && state.model_ok && $('img')) { const i = $('img'); i.onload = () => drawStage(); i.src = imgUrl(); }
});
$('zi').onclick = () => { zoom = Math.min(zoom * 1.3, 6); applyZoom(); };
$('zo').onclick = () => { zoom = Math.max(zoom / 1.3, .05); applyZoom(); };
$('zf').onclick = () => zoomTo([0, 0, 1, 1], 1);

/* ---------------- 右：模型卡 ---------------- */
function bandBar(p) {
  if (!p || p.value == null) return '';
  const span = (p.hi - p.lo) || 1;
  const pos = Math.max(0, Math.min(100, (p.value - p.lo) / span * 100));
  return `<div class="band"><div class="rail"></div><div class="in" style="left:6%;right:6%"></div>
    <div class="pin" style="left:calc(6% + ${(pos * .88).toFixed(1)}%)"></div>
    <div class="lbl" style="left:0">${f2(p.lo)}</div>
    <div class="lbl" style="right:0">${f2(p.hi)}</div></div>`;
}
function cardHTML(eq, r, i) {
  const d = (r && r.detail) || {};
  const m = d.model || {}, pr = d.pred || {}, v = d.verify || {}, obj = d.objective || {};
  const up = i > 0 ? state.chain[i - 1] : null;
  const head = `
  ${up && r && r.based_on ? `<div class="carry">↓ 承接 ${esc(up.tag)} ${esc(up.name)} 的建議條件</div>` : ''}
  <div class="blk head">
    <div class="eqline"><b>${esc(eq.tag)}</b><span>${esc(eq.name)}</span>
      <span class="ttag ${esc(eq.task)}">${esc(eq.task_txt)}</span>${q(TASK_TIP[eq.task] || '')}</div>
    ${r ? `<div class="obj">目標：${esc(obj.text || '')}</div>
      <div class="reco"><span class="from">${esc(obj.now || '')}</span><span class="arrow">→</span>
        <span class="to">${esc(r.value)} ${esc(r.unit)}</span>
        <span class="eff">${esc(obj.effect || '')}</span></div>
      <div class="hint" style="margin-top:5px">可調參數：${esc((obj.knob || {}).label || '')}（${esc(eq.knob.col)}）</div>`
    : `<div class="obj">目標 Y：${esc(eq.y.label)}　可調：${esc(eq.knob.label)}</div>
       <div class="hint">按右上「開始」跑這一段</div>`}
  </div>`;
  if (!r) return head;
  return head + `
  <div class="blk"><h3>這個數字怎麼算出來的 <i></i>${q('平台拿歷史數據學出「這些條件 → 會得到什麼結果」的關係，再用它推算，或反推最省的設定。')}</h3>
    <div class="kv"><span class="k">要預測的量</span>
      <span class="v">${esc((d.y || {}).label || '')} <span class="hint" style="font-weight:400">${esc((d.y || {}).col || '')}</span></span></div>
    <div class="kv"><span class="k">準不準<span class="q" data-tip="解釋力＝模型抓住了目標的多少變化，越接近 100% 越好（技術名稱 R²）。平均誤差＝預測值與實際值平均差多少，單位跟被預測的量相同（技術名稱 RMSE）。">?</span></span>
      <span class="v ok">解釋力 ${pct1(m.r2)} <span class="hint" style="font-weight:400">R² ${m.r2 == null ? '—' : m.r2}</span>
        　平均誤差 ±${m.rmse == null ? '—' : m.rmse} ${esc((d.y || {}).unit || '')} <span class="hint" style="font-weight:400">RMSE</span></span></div>
    <div class="kv"><span class="k">怎麼考的<span class="q" data-tip="把歷史數據切 5 份，每次用 4 份教模型、留 1 份當考卷，輪 5 次。分數是拿「沒看過的資料」考出來的，不是背答案（技術名稱：5 折交叉驗證）。">?</span></span>
      <span class="v" style="font-weight:400">切 5 份輪流當考卷${m.n_rows ? '　·　' + (+m.n_rows).toLocaleString() + ' 筆' : ''}</span></div>
    <div class="kv"><span class="k">用哪種模型<span class="q" data-tip="XGB＝梯度提升樹：一堆小決策樹接力修正前一棵的錯，工業表格數據最常用、也最耐雜訊的一種。">?</span></span>
      <span class="v" style="font-weight:400">${esc(m.algo || '')}</span></div>
    <div style="margin-top:8px"><span class="hint">主要影響因子</span>
      <span class="q" data-tip="訓練時能拿到的欄位會全部丟進去，這裡只列真正有貢獻的前幾個，百分比是相對貢獻度（把該欄的值打亂後模型變差多少來衡量）。">?</span>
      ${(m.top_features || []).length ? `<div class="fi">${(m.top_features).map(f => `
        <span>${esc(f.label)}</span>
        <span class="bar"><i style="width:${Math.round(f.share * 100)}%"></i></span>
        <span class="pc">${Math.round(f.share * 100)}%</span>`).join('')}</div>
        <div class="hint" style="margin-top:4px">共 ${m.n_features} 個欄位進入訓練</div>`
        : `<div style="margin-top:4px">${(m.features || []).map(f => `<span class="feat">${esc(f.label)}</span>`).join('')}</div>`}</div>
    ${d.why_soft ? `<div class="hint" style="margin-top:7px;color:#5B3BB8">${esc(d.why_soft)}</div>` : ''}
  </div>

  ${!d.search ? '' : `
  <div class="blk"><h3>怎麼找出這個建議的 <i></i>${q('不是拍腦袋：系統在「做得到的操作範圍」內大量試算，每一組都用模型算一次結果，挑出最符合目標又不違反約束的那一組。')}</h3>
    <div class="kv"><span class="k">調整對象</span><span class="v">${esc(d.search.knob.label)}
      <span class="hint" style="font-weight:400">${esc(d.search.knob.col)}</span></span></div>
    <div class="kv"><span class="k">可動範圍<span class="q" data-tip="${esc(d.search.range_src)}">?</span></span>
      <span class="v">${f2(d.search.range.lo)} ～ ${f2(d.search.range.hi)} ${esc(d.search.knob.unit || '')}</span></div>
    <div class="kv"><span class="k">找什麼</span><span class="v" style="font-weight:400">${esc(d.search.mode)}</span></div>
    ${(d.search.fixed || []).length ? `<div class="kv"><span class="k">釘住不動的條件<span class="q" data-tip="上游傳下來、或現場當下就是這個值的條件。搜尋時把它固定住，算出來的建議才跟現況相容。">?</span></span>
      <span class="v" style="font-weight:400">${d.search.fixed.map(x => esc(x.label) + ' ' + x.value + ' ' + esc(x.unit || '')).join('　')}</span></div>` : ''}
    <div class="kv"><span class="k">試了幾組<span class="q" data-tip="先在整個可動範圍內隨機撒點粗掃，再針對表現最好的幾組在它附近密集細搜——比逐格掃描快，也不會卡在局部最佳。">?</span></span>
      <span class="v" style="font-weight:400">${esc(d.search.method)}</span></div>
  </div>`}

  <div class="blk"><h3>預測值與誤差範圍 <i></i>${q('模型給的是估計值不是保證值。談效益要看範圍，不能只看中間那個數字。')}</h3>
    <div class="kv"><span class="k">${esc((d.y || {}).label || '')}（照建議設定後）</span>
      <span class="v">${f2(pr.value)} ${esc((d.y || {}).unit || '')}</span></div>
    <div class="kv"><span class="k">可能落在<span class="q" data-tip="用模型的平均誤差往上下各推 1.96 倍算出來的範圍，實際值大約有 95% 機率落在裡面（技術名稱：95% 信賴區間）。區間越窄代表越有把握。">?</span></span>
      <span class="v">${f2(pr.lo)} ～ ${f2(pr.hi)}　<span class="hint">±${f2(pr.band)}</span></span></div>
    ${bandBar(pr)}
    ${d.constraint ? `<div class="kv"><span class="k">約束：${esc(d.constraint.label)} ${esc(d.constraint.rule)}</span>
      <span class="v ${d.constraint.ok ? 'ok' : 'no'}">預估 ${d.constraint.predicted}　${d.constraint.ok ? '通過' : '未過'}</span></div>` : ''}
  </div>

  <div class="blk"><h3>現場實際值 <i></i>${q('模型上線後會慢慢失準。拿同一時刻的現場值跟模型算的比一次，差太多就該重訓。')}</h3>
    <div class="kv"><span class="k">現場值</span><span class="v">${f2(v.actual)} ${esc((d.y || {}).unit || '')}</span></div>
    <div class="kv"><span class="k">模型值（同一刻）</span><span class="v">${f2(v.model)} ${esc((d.y || {}).unit || '')}</span></div>
    <div class="kv"><span class="k">差</span>
      <span class="v ${v.ok ? 'ok' : 'no'}">${f2(v.resid)}（容許 ±${f2(v.tol)}）　${v.ok ? '模型還準' : '超出，建議重訓'}</span></div>
    <div class="srcrow"><span class="k">出處</span><span>${esc((d.source || {}).kind_txt || '平台歷史資料')}</span>
      <span class="sp"></span>
      <span class="conn ${(d.source || {}).connected ? 'live' : ''}">${(d.source || {}).connected ? '已連線' : '未連線'}</span>
      <button class="mini-btn" data-src="${esc((d.source || {}).point || '')}">設定來源</button></div>
    ${((d.source || {}).config && Object.keys(d.source.config).length)
      ? `<div class="hint" style="margin-top:4px">${Object.entries(d.source.config).map(([k, val]) => esc(k) + '=' + esc(val)).join('　')}</div>` : ''}
    <div id="srcbox"></div>
  </div>

  <div class="blk"><h3>這條建議還算數嗎 <i></i>${q('建議是在「某些條件不變」的前提下算的。前提變了（例如進料量突然改），建議就不再成立，要重算。')}</h3>
    <div class="chk">
      <span class="hd">條件</span><span class="hd n">建議時</span><span class="hd n">現在</span><span class="hd n">狀態</span>
      ${(d.checks || []).map(c => `<span>${esc(c.label)}${c.is_knob ? ' <span class="hint">（可調）</span>' : ''}</span>
        <span class="n">${f2(c.at_reco)}</span><span class="n">${f2(c.now)}</span>
        <span class="st ${c.is_knob ? (c.applied ? 'ok' : '') : (c.ok ? 'ok' : 'no')}">${
          c.is_knob ? (c.applied ? '已套用' : '待套用') : (c.ok ? '正常' : '已偏離')}</span>`).join('')}
    </div>
    <div class="hint" style="margin-top:6px">標「可調」的是要人去改的設定，看的是現場套用了沒；其他幾列是<b>假設不變</b>的條件，超出近 7 天的正常波動範圍就代表前提已變。</div>
  </div>

  <div class="blk"><h3>這筆結果哪來的 <i></i>${q('不管是平台內建、你們自己的、還是第三方算的模型，都用同一支 API 把結果送進來，一定要記名字、時間、依據的點位——之後有爭議查得回去。')}</h3>
    <div class="kv"><span class="k">模型</span><span class="v">${esc(r.model)}</span></div>
    <div class="kv"><span class="k">承接時間 / 入庫者</span><span class="v">${esc(when(r.computed_at))}　${esc(who(r.by))}</span></div>
    <div class="kv"><span class="k">依據點位</span><span class="v">${esc(r.point)}</span></div>
    ${r.based_on ? `<div class="kv"><span class="k">承接自</span><span class="v">${esc(r.based_on)}</span></div>` : ''}
    <details class="api"><summary>POST /api/twin/result</summary>
      <pre>${esc(JSON.stringify(r, null, 1))}</pre></details>
  </div>`;
}
/* ---- 現場值來源：協定選單＋點位位址，可人工覆寫 ---- */
let SRC = { kinds: {}, sources: {} };
async function loadSources() { try { SRC = await getJSON('/api/twin/source'); } catch {} }
function srcFormHTML(point) {
  const cur = SRC.sources[point] || { kind: 'history', config: {}, value: null };
  const kinds = SRC.kinds || {};
  const fields = (kinds[cur.kind] || {}).fields || [];
  return `<div class="srcform">
    <div class="g"><span>來源</span>
      <select id="sk">${Object.entries(kinds).map(([k, v]) =>
        `<option value="${esc(k)}" ${k === cur.kind ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select></div>
    ${fields.map(f => `<div class="g"><span>${esc(f.label)}</span>
      <input data-f="${esc(f.key)}" placeholder="${esc(f.ph)}" value="${esc((cur.config || {})[f.key] || '')}"/></div>`).join('')}
    ${cur.kind === 'manual' ? `<div class="g"><span>目前值</span>
      <input id="sv" type="number" step="any" value="${cur.value == null ? '' : cur.value}"/></div>` : ''}
    <div class="act"><button class="mini-btn primary" id="ssave">儲存</button>
      <button class="mini-btn" id="scancel">取消</button></div>
    <div class="hint" style="margin-top:6px">目前只存綁定設定與人工值；即時連線讀值是下一步（平台已有 OPC UA／Modbus 連線元件）。</div>
  </div>`;
}
function bindSrc() {
  document.querySelectorAll('[data-src]').forEach(b => b.onclick = () => {
    const point = b.dataset.src, box = $('srcbox');
    if (box.dataset.open === point) { box.innerHTML = ''; box.dataset.open = ''; return; }
    box.dataset.open = point; box.innerHTML = srcFormHTML(point);
    $('sk').onchange = () => {
      SRC.sources[point] = { ...(SRC.sources[point] || {}), kind: $('sk').value,
        config: SRC.sources[point] ? SRC.sources[point].config : {} };
      box.innerHTML = srcFormHTML(point); bindSrcForm(point);
    };
    bindSrcForm(point);
  });
}
function bindSrcForm(point) {
  $('scancel').onclick = () => { $('srcbox').innerHTML = ''; $('srcbox').dataset.open = ''; };
  $('ssave').onclick = async () => {
    const cfg = {};
    document.querySelectorAll('.srcform [data-f]').forEach(i => { if (i.value.trim()) cfg[i.dataset.f] = i.value.trim(); });
    const body = { point, kind: $('sk').value, config: cfg };
    const sv = $('sv'); if (sv && sv.value !== '') body.value = parseFloat(sv.value);
    try {
      await getJSON('/api/twin/source', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      await loadSources();
      $('srcbox').innerHTML = ''; $('srcbox').dataset.open = '';
      await load();
    } catch (e) { alert(e.message); }
  };
}

function overviewHTML() {
  const done = byAsset();
  const cards = state.chain.map((eq, i) => {
    const r = done[eq.tag], obj = (r && r.detail && r.detail.objective) || {};
    return `<div class="ovcard ${r ? 'done' : ''}" data-i="${i}">
      <div class="t"><b>${esc(eq.tag)}</b><span>${esc(eq.name)}</span>
        <span class="ttag ${esc(eq.task)}" style="margin-left:auto">${esc(eq.task_txt)}</span></div>
      ${r ? `<div class="reco" style="border:0;padding-top:6px;margin-top:4px">
        <span class="from">${esc(obj.now || '')}</span><span class="arrow">→</span>
        <span class="to" style="font-size:19px">${esc(r.value)} ${esc(r.unit)}</span>
        <span class="eff">${esc(obj.effect || '')}</span></div>`
      : `<div class="hint" style="margin-top:4px">目標 Y：${esc(eq.y.label)}　可調：${esc(eq.knob.label)}</div>`}
    </div>`;
  }).join('');
  const rows = state.chain.map(eq => {
    const r = done[eq.tag], o = (r && r.detail && r.detail.objective) || {};
    return r ? `<div class="row"><span>${esc(eq.tag)} ${esc(eq.name)}</span><b>${esc(o.effect || '')}</b></div>` : '';
  }).join('');
  const sum = results.length === 3 ? `<div class="sum"><h3>三段合計（守品質規格前提下）</h3>${rows}
      <div class="hint" style="margin-top:7px">換算成金額需要電價／燃氣單價／回料處理成本——那是廠端資料，接上就能算。</div>
    </div>` : '';
  return cards + sum;
}
function renderPanel() {
  const done = byAsset();
  if (view === 'all') {
    $('side-title').textContent = '總覽';
    $('navbar').style.display = 'none';
    $('panel').innerHTML = overviewHTML();
    $('panel').querySelectorAll('.ovcard').forEach(c => c.onclick = () => { step = +c.dataset.i; setView('nav'); });
    return;
  }
  const eq = state.chain[step], r = done[eq.tag];
  $('side-title').textContent = `導覽　${step + 1}／${state.chain.length}`;
  $('navbar').style.display = '';
  $('who').innerHTML = `<b>${esc(eq.tag)}</b>　${esc(eq.name)}`;
  $('dots').innerHTML = state.chain.map((e, i) =>
    `<i class="${i === step ? 'on' : ''} ${done[e.tag] && i !== step ? 'done' : ''}"></i>`).join('');
  $('prev').disabled = step === 0;
  $('next').disabled = step === state.chain.length - 1;
  $('panel').innerHTML = cardHTML(eq, r, step);
  $('panel').scrollTop = 0;
  bindSrc();
}
function render() { renderPanel(); drawStage(); }
function setView(v) {
  view = v;
  document.querySelectorAll('#view button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render();
}
document.querySelectorAll('#view button').forEach(b => b.onclick = () => setView(b.dataset.v));
$('prev').onclick = () => { if (step > 0) { step--; render(); } };
$('next').onclick = () => { if (step < state.chain.length - 1) { step++; render(); } };
addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

/* ---------------- 載入與執行 ---------------- */
async function load() {
  if (!Object.keys(SRC.kinds || {}).length) await loadSources();
  try { state = await getJSON('/api/twin/advisor/demo'); }
  catch (e) { $('panel').innerHTML = `<div class="hint">${esc(e.message)}</div>`; return; }
  results = state.results || [];
  $('tag-real').textContent = state.model_ok ? '資產模型：真實（M0200）' : '資產模型：本網域尚未建模';
  $('tag-real').className = 'tag ' + (state.model_ok ? 'real' : 'sim');
  $('cap').textContent = state.model_ok ? state.drawing.replace(/\.pdf$/i, '') : '';
  if (!$('img')) loadImage();
  const tot = Object.keys(state.models).length, ok = Object.values(state.models).filter(m => m.status === 'done').length;
  $('run').disabled = !state.ready;
  $('run').textContent = state.ready ? (results.length ? '重跑' : '開始') : `訓練中 ${ok}／${tot}`;
  if (!state.ready) setTimeout(load, 3000);
  render();
}
$('run').onclick = async () => {
  $('run').disabled = true; $('run').textContent = '尋優中…';
  try {
    const d = await getJSON('/api/twin/advisor/demo/run', { method: 'POST' });
    results = d.cards;
    for (let i = 0; i < d.cards.length; i++) { step = i; setView('nav'); await new Promise(z => setTimeout(z, 1500)); }
    setView('all');
  } catch (e) { $('panel').innerHTML = `<div class="hint">${esc(e.message)}</div>`; }
  $('run').disabled = false; $('run').textContent = '重跑';
};
fetch('/api/version').then(r => r.json()).then(v => { $('ver').textContent = `v${v.version}`; }).catch(() => {});
load();
</script>
</body>
</html>
